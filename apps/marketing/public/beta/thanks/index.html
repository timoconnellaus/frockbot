<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#d3266d" />
    <link rel="canonical" href="https://frockbot.com/beta/thanks/" />
    <link rel="icon" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>You're on the list · FrockBot</title>
    <script src="/critters.js" defer></script>
  </head>
  <body class="legal-page beta-page">
    <header class="site-header legal-header">
      <div class="container nav-shell">
        <a class="brand" href="/" aria-label="FrockBot home, in beta">
          <img src="/assets/app-icon.png" alt="" width="48" height="48" />
          <span class="brand-name"
            >Frock<span class="brand-accent">Bot</span></span
          >
          <span class="beta-tag" aria-hidden="true">Beta</span>
        </a>
        <nav class="legal-nav" aria-label="Beta navigation">
          <a href="/">Home</a>
          <a href="/beta/">The beta</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="legal-hero beta-hero" aria-labelledby="thanks-title">
        <div class="container legal-hero-shell">
          <div class="beta-hero-copy">
            <p class="section-label">Place saved</p>
            <h1 id="thanks-title">You're on <em>the list.</em></h1>
            <p class="legal-intro">
              We'll email you when your invite is ready. Invites go out in small
              batches, longest-waiting first.
            </p>
            <div class="beta-card beta-wait">
              <h2>While you wait</h2>
              <a href="/how-it-works/"
                >See how it works <span aria-hidden="true">→</span></a
              >
              <a href="/open/#run"
                >Rather run your own? It's open source
                <span aria-hidden="true">→</span></a
              >
            </div>
          </div>
          <img
            class="beta-hero-character cheer"
            src="/assets/characters/nudge.png"
            alt=""
            width="280"
            height="340"
          />
        </div>
      </section>
    </main>
  </body>
</html>
