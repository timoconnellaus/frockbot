<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Inside FrockBot</title>
  <desc id="description">A FrockBot character beside a cloud Bot connected to plugins, a phone and a desktop.</desc>
  <rect width="1200" height="630" fill="#1e1d27"/>
  <circle cx="1050" cy="70" r="210" fill="#d3266d" opacity=".2"/>
  <circle cx="120" cy="600" r="260" fill="#fce2ea" opacity=".08"/>
  <text x="80" y="98" fill="#d3266d" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">INSIDE FROCKBOT</text>
  <text x="80" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="800">Dress your Bot</text>
  <text x="80" y="232" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="800">however you want.</text>
  <text x="80" y="286" fill="#d8cfd9" font-family="Arial, sans-serif" font-size="23">Persistent cloud Bots · Native apps · Plugins</text>
  <g stroke="#d3266d" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M620 320H760"/>
    <path d="M870 385V465"/>
    <path d="M870 465H720"/>
    <path d="M870 465H1020"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="760" y="270" width="220" height="116" rx="28" fill="#fff"/>
    <text x="870" y="320" fill="#1e1d27" font-size="19" font-weight="700">CLOUD BOT</text>
    <text x="870" y="353" fill="#6d6974" font-size="16">durable Turns</text>
    <rect x="615" y="448" width="210" height="94" rx="18" fill="#fce2ea"/>
    <text x="720" y="490" fill="#1e1d27" font-size="18" font-weight="700">PLUGINS</text>
    <text x="720" y="517" fill="#6d6974" font-size="14">tools · hooks · UI</text>
    <rect x="915" y="448" width="110" height="144" rx="20" fill="#fff"/>
    <rect x="932" y="472" width="76" height="91" rx="7" fill="#fce2ea"/>
    <text x="970" y="582" fill="#1e1d27" font-size="14" font-weight="700">PHONE</text>
    <rect x="1040" y="448" width="120" height="92" rx="10" fill="#fff"/>
    <rect x="1055" y="463" width="90" height="53" rx="4" fill="#fce2ea"/>
    <path d="M1090 540v20m-30 0h60" stroke="#fff" stroke-width="8"/>
    <text x="1100" y="588" fill="#fff" font-size="14" font-weight="700">DESKTOP</text>
  </g>
  <image xlink:href="../characters/fox.png" x="410" y="300" width="215" height="290" preserveAspectRatio="xMidYMid meet"/>
</svg>
