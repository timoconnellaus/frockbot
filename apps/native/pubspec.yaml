name: frockbot_native
description: FrockBot native qualification prototype.
publish_to: none
version: 1.3.0+2

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: "3.47.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1
  flutter_secure_storage: 11.0.0
  app_links: 7.2.1
  path_provider: 2.1.6
  url_launcher: 6.3.2
  crypto: 3.0.7
  http: 1.6.0
  restart_app: 1.9.1
  shorebird_code_push: 2.0.7
  web: 1.1.1
  web_socket_channel: 3.0.3
  # Voice: streaming PCM16 capture, and gapless PCM16 playback with an
  # interrupt. `record` asks for the microphone permission itself, so no
  # separate permission plugin is carried for it.
  record: 7.1.1
  flutter_pcm_sound: 3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sheep/
    - assets/connectors/
    - shorebird.yaml
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-latin-400.ttf
          weight: 400
        - asset: assets/fonts/inter-latin-500.ttf
          weight: 500
        - asset: assets/fonts/inter-latin-600.ttf
          weight: 600
        - asset: assets/fonts/inter-latin-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-latin.ttf
    - family: Archivo Black
      fonts:
        - asset: assets/fonts/archivo-black-latin.ttf

dependency_overrides:
  webview_flutter_wkwebview:
    path: vendor/webview_flutter_wkwebview
