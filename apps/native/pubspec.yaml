name: frockbot_native
description: >-
  FrockBot's application: the client package run with FrockBot's brand.
publish_to: none
# The release tag is the version: `release.yml` stamps it with `--build-name`
# (`scripts/native-metadata.ts`). This placeholder names any other build.
version: 0.0.0+1

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: "3.47.0"

# The client is a package this application depends on, resolved with it as one
# workspace under one `pubspec.lock` (ADR 0038). A white-label is another
# application that depends on it the same way, by git URL and release tag.
workspace:
  - packages/frockbot_client

dependencies:
  flutter:
    sdk: flutter
  frockbot_client:
    path: packages/frockbot_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # What the suites import directly; the versions are the client's.
  crypto: 3.0.7
  http: 1.6.0
  record: 7.1.1
  web_socket_channel: 3.0.3

flutter:
  uses-material-design: true
  assets:
    # FrockBot's characters, which its brand names by these keys.
    - assets/characters/
    - shorebird.yaml

dependency_overrides:
  webview_flutter_wkwebview:
    path: vendor/webview_flutter_wkwebview
