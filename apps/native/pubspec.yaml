name: frockbot_native
description: FrockBot native qualification prototype.
publish_to: none
version: 1.2.0+2

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: "3.47.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1
  flutter_secure_storage: 11.0.0
  app_links: 7.2.1
  path_provider: 2.1.6
  url_launcher: 6.3.2
  crypto: 3.0.7
  http: 1.6.0
  web: 1.1.1
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sheep/
    - shorebird.yaml
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-latin.ttf
    - family: Archivo Black
      fonts:
        - asset: assets/fonts/archivo-black-latin.ttf

dependency_overrides:
  webview_flutter_wkwebview:
    path: vendor/webview_flutter_wkwebview
