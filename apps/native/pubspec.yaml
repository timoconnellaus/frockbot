name: frockbot_native
description: FrockBot native qualification prototype.
publish_to: none
version: 1.4.0+2

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: "3.47.0"

dependencies:
  flutter:
    sdk: flutter
  frockbot_client:
    path: packages/frockbot_client
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1
  flutter_secure_storage: 11.0.0
  app_links: 7.2.1
  path_provider: 2.1.6
  url_launcher: 6.3.2
  crypto: 3.0.7
  http: 1.6.0
  restart_app: 1.9.1
  shorebird_code_push: 2.0.7
  web: 1.1.1
  web_socket_channel: 3.0.3
  # `record` owns microphone permission. Playback uses the app’s device sink
  # so completion means samples were played, not just handed to the device.
  record: 7.1.1
  flutter_slidable: 4.0.3
  rive: 0.14.11
  # The A2UI renderer a Card is drawn with (ADR 0030). `genui` speaks v0.9 and
  # `a2ui_core` is its object model; `json_schema_builder` is how a catalog
  # item states its data schema, which the Frock catalog writes directly.
  genui: 0.10.3
  a2ui_core: 0.1.1
  json_schema_builder: 0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/connectors/
    - shorebird.yaml
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-latin-400.ttf
          weight: 400
        - asset: assets/fonts/inter-latin-500.ttf
          weight: 500
        - asset: assets/fonts/inter-latin-600.ttf
          weight: 600
        - asset: assets/fonts/inter-latin-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-latin.ttf
    - family: Archivo Black
      fonts:
        - asset: assets/fonts/archivo-black-latin.ttf

dependency_overrides:
  webview_flutter_wkwebview:
    path: vendor/webview_flutter_wkwebview
