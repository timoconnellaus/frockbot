name: Mac desktop

on:
  pull_request:
    paths:
      - "apps/native/**"
      - "app/machine/**"
      - "apps/device-host/**"
      - "core/machine-protocol/**"
      - "scripts/mac-release*"
      - "scripts/fetch-deno.py"
      - "scripts/mac-appcast*"
      - ".github/workflows/mac-release.yml"
  push:
    tags:
      - "mac-v*.*.*"

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Mac desktop
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test app/machine/device.test.ts app/machine/device-runner.test.ts
      # The module sandbox, proved where it runs: Deno under the Seatbelt
      # profile a module gets, reaching what it declared and nothing else.
      - run: python3 scripts/fetch-deno.py aarch64-apple-darwin "$RUNNER_TEMP/deno/deno"
      - run: bun test apps/device-host
        env:
          FROCKBOT_TEST_DENO: ${{ runner.temp }}/deno/deno
      - run: python3 scripts/mac-release-test.py
      - run: python3 scripts/mac-appcast-test.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
      # Plain `pub get`, as `ci.yml` resolves it. `--enforce-lockfile` belongs
      # to `native.yml`, which owns the pins; asking for it here fails on a
      # freshly downloaded SDK, whose own unresolved workspace drags
      # `flutter_tools` (and its exact `petitparser`) into the app resolution,
      # where the lockfile has no entry to satisfy.
      - run: flutter pub get
        working-directory: apps/native
      # The client names no deployment of its own, so the suite passes an origin
      # that reaches nothing (ADR 0028).
      - run: flutter test --no-pub --dart-define=FROCKBOT_ORIGIN=https://tests.invalid test/desktop_update_test.dart
        working-directory: apps/native
      - run: python3 scripts/mac-release.py 0.0.0

  draft:
    name: Create Mac release draft
    if: startsWith(github.ref, 'refs/tags/mac-v')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft awaiting signed and notarized archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "FrockBot for Mac ${GITHUB_REF_NAME#mac-}" --notes "Main FrockBot Mac app. Publication requires verified Developer ID signed, notarized and stapled universal Mac archive."
          fi
