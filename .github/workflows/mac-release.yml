name: Mac desktop

on:
  pull_request:
    paths:
      - "apps/mac-messages/**"
      - "apps/native/**"
      - "app/machine/**"
      - "app/machine-messages/**"
      - "core/machine-protocol/**"
      - "scripts/mac-release*"
      - ".github/workflows/mac-release.yml"
  push:
    tags:
      - "mac-v*.*.*"

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Mac desktop
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run --filter @frockbot/mac-messages typecheck
      - run: bun test apps/mac-messages app/machine/device.test.ts app/machine/device-runner.test.ts app/machine-messages
      - run: python3 scripts/mac-release-test.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/native
      - run: flutter test --no-pub test/mac_messages_test.dart
        working-directory: apps/native
      - run: python3 scripts/mac-release.py 0.0.0

  draft:
    name: Create Mac release draft
    if: startsWith(github.ref, 'refs/tags/mac-v')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft awaiting signed and notarized archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "FrockBot for Mac ${GITHUB_REF_NAME#mac-}" --notes "Main FrockBot Mac app with optional Messages access. Publication requires verified Developer ID signed, notarized and stapled universal Mac archive."
          fi
