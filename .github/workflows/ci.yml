name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check UI style contract
        run: bun run lint:ui-styles

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Test Cloudflare runtime compatibility
        run: bun run --filter @frockbot/cloudflare test:workerd

      - name: Test Package bundler runtime
        run: bun run --filter @frockbot/cloudflare-bundler test:workerd

      - name: Test Cloudflare integration
        # `SELF.fetch` through the real gateway, the real built artifact and the
        # real Durable Objects. The provider is stubbed at the outbound seam and
        # authentication uses the development identity, so this needs no secret.
        run: bun run --filter @frockbot/cloudflare test:integration

      # No Docker: this is the decoders, the shard function, the router, and
      # the container server against a fake SpritesClient. The container image
      # and a real Sprite are the opt-in `test:live`, run by hand.
      - name: Test Computer host
        run: bun run --filter @frockbot/computer-host test

      # The outbound WebSocket bridge in workerd, against a Worker
      # impersonating the Sprites API at the outbound seam. No Docker, no
      # Sprites cloud: the handshake, the socket pair and the pumping are the
      # runtime's own, which is the part the injected fakes cannot model.
      - name: Test Computer host runtime
        run: bun run --filter @frockbot/computer-host test:workerd

      - name: Build
        run: bun run build

      - name: Run Cordis proof
        # The smoke test launches a real Electron app; the hosted runner is
        # headless and its Chromium SUID sandbox helper is not setuid-root, so
        # run under a virtual display with the sandbox disabled.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum bun run proof:cordis

  e2e:
    name: Browser end-to-end (${{ matrix.shard }}/${{ strategy.job-total }})
    # Deliberately not `needs: validate`. This job shares nothing with Validate
    # — it installs its own dependencies and the harness builds the artifact
    # itself — so gating it behind Validate only made a two-minute job wait
    # nine minutes for an answer it never reads. The cost is that a push which
    # fails typecheck still spends these runners; `deploy-staging` below is
    # where the two are actually required to agree.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The specs cannot overlap inside one run — they share a Worker and a fake
    # provider whose chat mode a spec changes — so the parallelism is across
    # runners, not workers. Each shard is a whole runner with its own harness:
    # its own ports, its own `--persist-to` directory, its own artifact build.
    # Playwright keeps a spec file whole within a shard, since `fullyParallel`
    # is off and the file is therefore one indivisible group.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test browser end to end
        # A browser against `wrangler dev` running `src/index.ts` and the real
        # built artifact. The harness builds the artifact, seeds it into the
        # local bucket and starts a fake Ollama server on loopback, so this
        # needs no Cloudflare credential and no provider key.
        working-directory: apps/cloudflare
        run: >-
          bun run test:e2e
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload shard report
        # Unconditional, unlike the failure diagnostics below: the merged report
        # is only whole if every shard contributed its blob, including the ones
        # that passed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-blob-report-${{ matrix.shard }}
          path: apps/cloudflare/e2e/blob-report
          retention-days: 1
          if-no-files-found: error

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: apps/cloudflare/e2e/test-results
          retention-days: 7

      - name: Upload wrangler logs
        # `wrangler dev` writes its debug log — including everything workerd
        # printed — to this directory whatever `--log-level` says. When the
        # runtime dies mid-suite, this is the only record of why.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wrangler-logs-${{ matrix.shard }}
          path: ~/.config/.wrangler/logs
          retention-days: 7
          if-no-files-found: warn

  e2e-gate:
    # The `main` ruleset requires a check by this exact name, and sharding the
    # job renamed the four that do the work — a required check that no job
    # reports blocks every pull request forever. This job keeps the name
    # stable, so the shard count stays a one-line edit to `matrix.shard`
    # rather than a change to the repository's protection rules.
    name: Browser end-to-end
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every shard to have passed
        # A matrix result is `success` only when no leg failed, and `fail-fast`
        # is off, so this reports on the whole suite rather than the first loss.
        env:
          SHARDS: ${{ needs.e2e.result }}
        run: |
          echo "Browser end-to-end shards: $SHARDS"
          if [[ "$SHARDS" != "success" ]]; then exit 1; fi

  e2e-report:
    name: Browser end-to-end report
    needs: e2e
    # Only when a shard failed: a green run's report is never read, and the
    # merge would cost a runner on every push for nothing.
    if: ${{ failure() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: apps/cloudflare/blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        working-directory: apps/cloudflare
        run: bunx playwright merge-reports --reporter html blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/cloudflare/playwright-report
          retention-days: 7

  deploy-staging:
    name: Deploy staging
    # Staging follows the branch: merging to main integrates code and shows it
    # running at staging-bot.frockbot.com. Production still follows the tag
    # (`release.yml`), so nothing here can ship to bot.frockbot.com.
    needs: [validate, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.BETTER_AUTH_URL }}

    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
        shell: bash
        run: |
          missing=()
          # FROCKBOT_ADMIN_EMAILS is required here, unlike production. Staging
          # signups are closed and stay closed, so the admin allowlist is the
          # only way any identity reaches the deployment: without it, nobody
          # can sign in and nobody can open Admin to change that.
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            BETTER_AUTH_URL \
            BETTER_AUTH_SECRET \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            FROCKBOT_ADMIN_EMAILS \
            SPRITES_TOKEN \
            COMPUTER_HOST_TOKEN \
            CREDENTIAL_KEYRING \
            ROUTINE_HOOK_SECRET \
            MACHINE_TOKEN_SECRET; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          bun -e '
            import { parseCredentialKeyringV1 } from "./packages/connection-core/src/index.ts";
            parseCredentialKeyringV1(process.env.CREDENTIAL_KEYRING ?? "");
          '

      - name: Provision staging resources
        # Staging is disposable, so it provisions itself rather than depending
        # on a human having run a wizard first. Every step is create-if-absent,
        # so re-running a deploy neither fails nor recreates anything. The
        # Durable Object namespaces need no step: they are created with the
        # Worker, and belong to it.
        id: resources
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          for bucket in \
            frockbot-application-artifacts-staging \
            frockbot-memory-files-staging \
            frockbot-package-catalog-staging; do
            if bunx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
              echo "R2 bucket $bucket already exists"
            else
              bunx wrangler r2 bucket create "$bucket"
            fi
          done

          # 768 cosine dimensions, matching @cf/baai/bge-base-en-v1.5 — the
          # embedding model the memory Package uses on Cloudflare.
          if bunx wrangler vectorize get frockbot-memory-staging >/dev/null 2>&1; then
            echo "Vectorize index frockbot-memory-staging already exists"
          else
            bunx wrangler vectorize create frockbot-memory-staging \
              --preset @cf/baai/bge-base-en-v1.5
          fi

          # `d1 list` is the single authority on whether the database exists and
          # on its identifier, so creation and lookup cannot disagree: an `info`
          # probe would have to guess an exit code, and guessing wrong either
          # creates a database twice or never creates it at all.
          staging_database_id() {
            bunx wrangler d1 list --json |
              node -e '
                const chunks = [];
                process.stdin.on("data", (chunk) => chunks.push(chunk));
                process.stdin.on("end", () => {
                  const parsed = JSON.parse(chunks.join(""));
                  const databases = Array.isArray(parsed) ? parsed : parsed.result;
                  const match = (databases ?? []).find(
                    (database) => database.name === "frockbot-auth-staging",
                  );
                  process.stdout.write(match ? match.uuid : "");
                });
              '
          }

          database_id="$(staging_database_id)"
          if [[ -z "$database_id" ]]; then
            bunx wrangler d1 create frockbot-auth-staging
            database_id="$(staging_database_id)"
          else
            echo "D1 database frockbot-auth-staging already exists"
          fi
          if [[ ! "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            printf 'Resolved staging D1 identifier is not an identifier: %s\n' "$database_id" >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Configure staging D1 database
        working-directory: apps/cloudflare
        env:
          STAGING_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const databaseId = process.env.STAGING_D1_DATABASE_ID;
          const staging = /("database_name":\s*"frockbot-auth-staging",\s*"database_id":\s*")[^"]*(")/;
          const source = fs.readFileSync(file, 'utf8');
          if (!staging.test(source)) {
            throw new Error(`${file} no longer contains a staging frockbot-auth-staging database_id`);
          }
          fs.writeFileSync(file, source.replace(staging, `$1${databaseId}$2`));
          NODE

      - name: Build application artifact
        working-directory: apps/cloudflare
        run: bun run artifact:build

      - name: Configure application artifact
        id: artifact
        working-directory: apps/cloudflare
        run: |
          artifact_hash="$(sha256sum dist/artifacts/foundation-v1.mjs | cut -d ' ' -f 1)"
          echo "hash=$artifact_hash" >> "$GITHUB_OUTPUT"
          ARTIFACT_HASH="$artifact_hash" node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const placeholder = 'foundation-v1';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(placeholder)) {
            throw new Error(`${file} no longer contains the default application hash ${placeholder}`);
          }
          fs.writeFileSync(file, source.replaceAll(placeholder, process.env.ARTIFACT_HASH));
          NODE

      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler d1 migrations apply frockbot-auth-staging
          --env staging --remote

      - name: Upload application artifact
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler r2 object put
          frockbot-application-artifacts-staging/applications/${{ steps.artifact.outputs.hash }}.mjs
          --file dist/artifacts/foundation-v1.mjs
          --remote

      - name: Publish Package Catalog
        # As production publishes it, into staging's own bucket: every
        # generation object first, then the one mutable pointer that names it.
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          bucket=frockbot-package-catalog-staging
          catalog_dir="$RUNNER_TEMP/frockbot-catalog-staging"
          rm -rf "$catalog_dir"
          bun ../../scripts/publish-catalog.ts --out "$catalog_dir"
          while IFS= read -r file; do
            key="${file#"$catalog_dir"/}"
            if [[ "$key" == "catalog/current" ]]; then continue; fi
            bunx wrangler r2 object put "$bucket/$key" \
              --file "$file" --content-type application/json --remote
          done < <(find "$catalog_dir" -type f | sort)
          bunx wrangler r2 object put "$bucket/catalog/current" \
            --file "$catalog_dir/catalog/current" \
            --content-type application/json --remote

      - name: Deploy Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-staging.env"
          trap 'rm -f "$secrets_file"' EXIT

          # JSON, not dotenv: see the production deploy in `release.yml` for
          # why a secret that is itself JSON would otherwise arrive mangled.
          node <<'NODE' > "$secrets_file"
          const names = [
            'BETTER_AUTH_URL',
            'BETTER_AUTH_SECRET',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_CLIENT_SECRET',
            'FROCKBOT_ADMIN_EMAILS',
            'SPRITES_TOKEN',
            'COMPUTER_HOST_TOKEN',
            'CREDENTIAL_KEYRING',
            'ROUTINE_HOOK_SECRET',
            'MACHINE_TOKEN_SECRET',
          ];
          const optional = ['DEBUG_TOKEN'].filter((name) => process.env[name]);
          console.log(
            JSON.stringify(
              Object.fromEntries(
                [...names, ...optional].map((name) => [name, process.env[name]]),
              ),
            ),
          );
          NODE

          bunx wrangler deploy --env staging --secrets-file "$secrets_file"
