name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check UI style contract
        run: bun run lint:ui-styles

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Test Cloudflare runtime compatibility
        run: bun run --filter @frockbot/cloudflare test:workerd

      - name: Test Package bundler runtime
        run: bun run --filter @frockbot/cloudflare-bundler test:workerd

      - name: Test Cloudflare integration
        # `SELF.fetch` through the real gateway, the real built artifact and the
        # real Durable Objects. The provider is stubbed at the outbound seam and
        # authentication uses the development identity, so this needs no secret.
        run: bun run --filter @frockbot/cloudflare test:integration

      # No Docker: this is the decoders, the shard function, the router, and
      # the container server against a fake SpritesClient. The container image
      # and a real Sprite are the opt-in `test:live`, run by hand.
      - name: Test Computer host
        run: bun run --filter @frockbot/computer-host test

      - name: Build
        run: bun run build

      - name: Run Cordis proof
        # The smoke test launches a real Electron app; the hosted runner is
        # headless and its Chromium SUID sandbox helper is not setuid-root, so
        # run under a virtual display with the sandbox disabled.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum bun run proof:cordis

  e2e:
    name: Browser end-to-end
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test browser end to end
        # A browser against `wrangler dev` running `src/index.ts` and the real
        # built artifact. The harness builds the artifact, seeds it into the
        # local bucket and starts a fake Ollama server on loopback, so this
        # needs no Cloudflare credential and no provider key.
        run: bun run --filter @frockbot/cloudflare test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/cloudflare/e2e/playwright-report
            apps/cloudflare/e2e/test-results
          retention-days: 7

  deploy-marketing:
    name: Deploy marketing site
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://frockbot.com

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy frockbot.com
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  deploy-backend:
    name: Deploy FrockBot app
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BETTER_AUTH_URL }}

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
        shell: bash
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_D1_DATABASE_ID \
            BETTER_AUTH_URL \
            BETTER_AUTH_SECRET \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            SPRITES_TOKEN \
            COMPUTER_HOST_TOKEN \
            CREDENTIAL_KEYRING; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          bun -e '
            import { parseCredentialKeyringV1 } from "./packages/connection-core/src/index.ts";
            parseCredentialKeyringV1(process.env.CREDENTIAL_KEYRING ?? "");
          '
      - name: Configure production D1 database
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!/^[0-9a-fA-F-]{36}$/.test(databaseId)) {
            throw new Error(`CLOUDFLARE_D1_DATABASE_ID is not a database identifier: ${databaseId}`);
          }
          const production = /("database_name":\s*"frockbot-auth",\s*"database_id":\s*")[^"]*(")/;
          const source = fs.readFileSync(file, 'utf8');
          if (!production.test(source)) {
            throw new Error(`${file} no longer contains a production frockbot-auth database_id`);
          }
          fs.writeFileSync(file, source.replace(production, `$1${databaseId}$2`));
          NODE

      - name: Build application artifact
        working-directory: apps/cloudflare
        run: bun run artifact:build

      - name: Configure application artifact
        id: artifact
        working-directory: apps/cloudflare
        run: |
          artifact_hash="$(sha256sum dist/artifacts/foundation-v1.mjs | cut -d ' ' -f 1)"
          echo "hash=$artifact_hash" >> "$GITHUB_OUTPUT"
          ARTIFACT_HASH="$artifact_hash" node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const placeholder = 'foundation-v1';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(placeholder)) {
            throw new Error(`${file} no longer contains the default application hash ${placeholder}`);
          }
          fs.writeFileSync(file, source.replaceAll(placeholder, process.env.ARTIFACT_HASH));
          NODE

      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply frockbot-auth --remote

      - name: Upload application artifact
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler r2 object put
          frockbot-application-artifacts/applications/${{ steps.artifact.outputs.hash }}.mjs
          --file dist/artifacts/foundation-v1.mjs
          --remote

      - name: Publish Package Catalog
        # The remote Catalog: immutable generations plus one mutable pointer.
        # The bucket is created here, not by hand, so a fresh account needs no
        # manual provisioning step. Every generation object is uploaded before
        # `catalog/current` names it, because the pointer is the only mutable
        # object and must never name a half-written generation.
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          bucket=frockbot-package-catalog
          if ! bunx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
            bunx wrangler r2 bucket create "$bucket"
          fi
          catalog_dir="$RUNNER_TEMP/frockbot-catalog"
          rm -rf "$catalog_dir"
          bun ../../scripts/publish-catalog.ts --out "$catalog_dir"
          while IFS= read -r file; do
            key="${file#"$catalog_dir"/}"
            if [[ "$key" == "catalog/current" ]]; then continue; fi
            bunx wrangler r2 object put "$bucket/$key" \
              --file "$file" --content-type application/json --remote
          done < <(find "$catalog_dir" -type f | sort)
          bunx wrangler r2 object put "$bucket/catalog/current" \
            --file "$catalog_dir/catalog/current" \
            --content-type application/json --remote

      - name: Deploy bundler Worker
        # The app's PACKAGE_BUNDLER service binding names this Worker, so it
        # must exist before the app version can be created.
        working-directory: apps/cloudflare-bundler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Deploy computer host
        # The app's COMPUTER_HOST service binding names this Worker, so it
        # must exist before the app version can be created; and the host must
        # be current before the app that calls it (ADR 0004, risk v). Wrangler
        # builds and pushes the container image here, which needs Docker — the
        # hosted runner has it.
        working-directory: apps/computer-host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-computer-host.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          const names = ['SPRITES_TOKEN', 'COMPUTER_HOST_TOKEN'];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy --secrets-file "$secrets_file"

      - name: Deploy Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-production.env"
          trap 'rm -f "$secrets_file"' EXIT

          # Wrangler reads a secrets file as JSON first and only falls back
          # to dotenv. A dotenv line keeps the backslash escapes inside a
          # double-quoted value, so a secret that is itself JSON (the
          # credential keyring) would reach the Worker mangled. Write JSON.
          node <<'NODE' > "$secrets_file"
          const names = [
            'BETTER_AUTH_URL',
            'BETTER_AUTH_SECRET',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_CLIENT_SECRET',
            'SPRITES_TOKEN',
            'COMPUTER_HOST_TOKEN',
            'CREDENTIAL_KEYRING',
          ];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy --secrets-file "$secrets_file"
