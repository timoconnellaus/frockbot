name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check UI style contract
        run: bun run lint:ui-styles

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Test Cloudflare runtime compatibility
        run: bun run --filter @frockbot/cloudflare test:workerd

      - name: Build
        run: bun run build

      - name: Run Cordis proof
        # The smoke test launches a real Electron app; the hosted runner is
        # headless and its Chromium SUID sandbox helper is not setuid-root, so
        # run under a virtual display with the sandbox disabled.
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum bun run proof:cordis

  deploy-marketing:
    name: Deploy marketing site
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://frockbot.com

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy frockbot.com
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  deploy-backend:
    name: Deploy FrockBot app
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BETTER_AUTH_URL }}

    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
        shell: bash
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_D1_DATABASE_ID \
            BETTER_AUTH_URL \
            BETTER_AUTH_SECRET \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            SPRITES_TOKEN \
            CREDENTIAL_KEYRING; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Configure production D1 database
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!/^[0-9a-fA-F-]{36}$/.test(databaseId)) {
            throw new Error(`CLOUDFLARE_D1_DATABASE_ID is not a database identifier: ${databaseId}`);
          }
          const production = /("database_name":\s*"frockbot-auth",\s*"database_id":\s*")[^"]*(")/;
          const source = fs.readFileSync(file, 'utf8');
          if (!production.test(source)) {
            throw new Error(`${file} no longer contains a production frockbot-auth database_id`);
          }
          fs.writeFileSync(file, source.replace(production, `$1${databaseId}$2`));
          NODE

      - name: Build application artifact
        working-directory: apps/cloudflare
        run: bun run artifact:build

      - name: Configure application artifact
        id: artifact
        working-directory: apps/cloudflare
        run: |
          artifact_hash="$(sha256sum dist/artifacts/foundation-v1.mjs | cut -d ' ' -f 1)"
          echo "hash=$artifact_hash" >> "$GITHUB_OUTPUT"
          ARTIFACT_HASH="$artifact_hash" node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const placeholder = 'foundation-v1';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(placeholder)) {
            throw new Error(`${file} no longer contains the default application hash ${placeholder}`);
          }
          fs.writeFileSync(file, source.replaceAll(placeholder, process.env.ARTIFACT_HASH));
          NODE

      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply frockbot-auth --remote

      - name: Upload application artifact
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler r2 object put
          frockbot-application-artifacts/applications/${{ steps.artifact.outputs.hash }}.mjs
          --file dist/artifacts/foundation-v1.mjs
          --remote

      - name: Deploy Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-production.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          for (const name of [
            'BETTER_AUTH_URL',
            'BETTER_AUTH_SECRET',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_CLIENT_SECRET',
            'SPRITES_TOKEN',
            'CREDENTIAL_KEYRING',
          ]) {
            console.log(`${name}=${JSON.stringify(process.env[name])}`);
          }
          NODE

          bunx wrangler deploy --secrets-file "$secrets_file"
