name: Native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter qualification (advisory)
    runs-on: ubuntu-latest
    # Separate advisory job; it is not a required branch-protection check.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify committed qualification pins
        run: python3 scripts/check-native-pins.py
      - name: Test the Android delivery script
        # The release pipeline's Android patch goes through this script.
        run: python3 scripts/native-update-test.py
      # The SDK is installed rather than probed for. It used to be neither: the
      # job looked for a `flutter` the runner image does not ship, printed a
      # `::notice::` and skipped every step below it, so these checks had never
      # actually run in CI. `ci.yml` now installs the same pin to build the web
      # client, which makes a job that still skips indefensible.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Confirm the runner holds the qualified SDK
        working-directory: apps/native
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["frameworkRevision"] == "4cf24164269a5ebf0c16a028a00727d0e77bbb05" else 1)' "$RUNNER_TEMP/flutter-version.json"
      - name: Resolve pinned packages
        working-directory: apps/native
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        working-directory: apps/native
        run: flutter analyze --no-pub
      - name: Test shared fixtures and native state machines
        working-directory: apps/native
        run: flutter test --no-pub
      - name: Build the web target
        working-directory: apps/native
        run: flutter build web --release --no-pub
