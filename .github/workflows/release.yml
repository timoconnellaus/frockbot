name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: Publish packages and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # This workflow only runs for maintainer-pushed version tags. The setup
      # actions do not restore dependency caches in this privileged job.
      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          for (const entry of fs.readdirSync('packages', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const file = path.join('packages', entry.name, 'package.json');
            if (!fs.existsSync(file)) continue;
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            manifest.version = process.env.VERSION;
            manifest.private = false;

            for (const section of [
              'dependencies',
              'devDependencies',
              'optionalDependencies',
              'peerDependencies',
            ]) {
              for (const [name, range] of Object.entries(manifest[section] ?? {})) {
                if (range === 'workspace:*') manifest[section][name] = process.env.VERSION;
                if (range === 'workspace:^') manifest[section][name] = `^${process.env.VERSION}`;
                if (range === 'workspace:~') manifest[section][name] = `~${process.env.VERSION}`;
              }
            }

            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Configure npm token when provided
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi

      - name: Publish packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          for manifest in packages/*/package.json; do
            package_dir="${manifest%/package.json}"
            package_name="$(node -p "require('./$manifest').name")"

            if npm view "$package_name@$VERSION" version >/dev/null 2>&1; then
              echo "$package_name@$VERSION is already published; skipping"
              continue
            fi

            npm publish --workspace "$package_dir" --access public
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
