name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # `main.yml` cuts the next patch tag once staging is green and starts this
  # workflow for it by name: a tag it creates with `GITHUB_TOKEN` raises no
  # `push` event. Run it with `--ref <tag>`, so `GITHUB_REF_NAME` is the tag
  # here exactly as it is for a tag pushed by hand.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    name: Verify the release tag
    # The gate every other job waits on. Publishing to npm and deploying to
    # production both depend on this passing, but not on each other: nothing
    # deployed here installs the published packages, they are built from the
    # source in this checkout. Keeping npm publishing off this critical path
    # is what lets a deploy start as soon as the code is known good.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only `publish-npm` needs the OIDC identity that npm trusts, and only it
    # needs write. This job builds and runs the test suite, so it takes the
    # narrowest permissions of the four.
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow only runs for maintainer-pushed version tags. The setup
      # actions do not restore dependency caches in this privileged job.
      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
          if (!semver.test(version)) {
            console.error(`Invalid release tag: ${process.env.GITHUB_REF_NAME}`);
            if (version.includes('+')) {
              console.error('npm does not accept SemVer build metadata in package versions.');
            }
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # `build` reaches `artifact:build`, whose first step is `flutter build
      # web` in `apps/native` — the web client is Flutter Web. Pinned to the
      # revision `apps/native/qualification.json` records and `native.yml`
      # checks for. No cache in this privileged tag-only job, for the same
      # reason the Bun and Node setups above restore none.
      - name: Set up Flutter # zizmor: ignore[cache-poisoning] tag-only release job
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable

      - name: Build
        run: bun run build

  publish-images:
    name: Publish container images
    # What a deployment with no Docker pulls. `bun run setup` deploys
    # `computer-host` and `applet-build` into an account that has never built an
    # image, so the images have to already exist somewhere Cloudflare will pull
    # them from — published under this tag, and before production moves, so a tag
    # either ships everything or ships nothing (ADR 0028 step 5).
    #
    # Docker Hub, not GHCR: Cloudflare Containers pull only from the Cloudflare
    # managed registry, Docker Hub, Amazon ECR and Google Artifact Registry, and
    # of those Docker Hub is the one where a *public* image needs no credentials
    # configured in the pulling account
    # (https://developers.cloudflare.com/containers/image-management/).
    #
    # Skips loudly while the Docker Hub secrets are unset, and production does
    # not wait on it: the hosted deployment still builds its images from the
    # Dockerfiles, so a missing publish costs the simple profile a tag, not
    # frockbot.com a release. Once the simple profile is announced, make this
    # job required by adding it to `deploy-backend`'s `needs`.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        id: login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf '::warning::%s is unset: this tag publishes no container images, so an installer cannot pull it.\n' "$name"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build and push the container images
        if: steps.login.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # The build context is the repository root for both images: each copies
          # workspace packages from outside its own directory, and the root
          # `.dockerignore` is what keeps the rest out. `linux/amd64` is what
          # Cloudflare Containers run, and `latest` is what a deployer who names
          # no tag gets.
          publish() {
            local dockerfile="$1" repository="$2"
            local image="docker.io/timoconnellaus/$repository"
            docker build \
              --platform linux/amd64 \
              -f "$dockerfile" \
              -t "$image:$VERSION" \
              -t "$image:latest" \
              .
            docker push "$image:$VERSION"
            docker push "$image:latest"
          }

          publish apps/computer-host/Dockerfile frockbot-computer-host
          publish apps/applet-build/Dockerfile frockbot-applet-build

      - name: Log out of Docker Hub
        if: always() && steps.login.outputs.publish == 'true'
        run: docker logout docker.io

  release-assets:
    name: Build the installer's release assets
    # The two things an installer cannot build for itself: the Flutter web client
    # (the app Worker's `assets` payload) and the application artifact the Worker
    # loads from R2. A deployer has neither Flutter nor this repository's build,
    # so both are attached to the Release for the tag they were built from.
    #
    # There is no prebuilt APK: a plain `flutter build apk` bakes
    # `FROCKBOT_ORIGIN` in, and a deployer's origin is not known here.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `artifact:build` chains `client:build`, which is `flutter build web` in
      # `apps/native`. Same pin as `native.yml`; no cache in a privileged
      # tag-only job.
      - name: Set up Flutter # zizmor: ignore[cache-poisoning] tag-only release job
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable

      - name: Build the web client and the application artifact
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/build-applets-assets.ts
          bun run --filter @frockbot/cloudflare artifact:build

      - name: Package the release assets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"

          # Zipped from inside `dist/web` so it unpacks straight into the
          # `assets.directory` a generated config points at: `_headers` and the
          # content-addressed `_flutter/<buildHash>/` payload, nothing above them.
          (cd apps/cloudflare/dist/web && zip -qr "$assets/frockbot-web-client-$VERSION.zip" .)

          # Attached as the bytes themselves rather than an archive, because the
          # R2 key the Worker loads it under is this file's own sha256.
          cp apps/cloudflare/dist/artifacts/foundation-v1.mjs \
            "$assets/frockbot-application-artifact-$VERSION.mjs"

      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frockbot-release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 7

  patch-android:
    name: Cut Android patch
    # The phone app's half of the release. A full Android release — a new APK
    # with Shorebird's engine, the patch public key baked in and the phone's
    # existing signer — is cut by hand with `bun run native:release` and
    # installed once, because it needs the phone and the Tailscale download
    # service (`apps/native/README.md`). Everything Dart ships from here: a
    # signed patch against the newest active release Shorebird reports, on
    # the staging track, and `promote-android` moves it to stable once the
    # backend deploy has landed. Nothing deployed here waits on this job, so a red
    # patch never blocks the web release; a tag whose `apps/native` matches
    # the previous release tag has nothing to patch and says so.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      release: ${{ steps.patch.outputs.release }}
      patch: ${{ steps.patch.outputs.patch }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous release tag is what "changed" is measured against.
          fetch-depth: 0

      - name: Compare the app with the previous release
        id: change
        shell: bash
        run: |
          set -euo pipefail
          # The tag before this one in version order. A hand-cut minor or
          # prerelease tag compares with whatever it followed, like the
          # automatic patch cut does.
          previous="$(git tag --list 'v[0-9]*' --sort=version:refname \
            | grep -B1 -Fx "$GITHUB_REF_NAME" | head -n 1)"
          if [[ -z "$previous" || "$previous" == "$GITHUB_REF_NAME" ]]; then
            echo "no earlier release tag; patching"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$previous" HEAD -- apps/native; then
            echo "apps/native is unchanged since $previous; nothing to patch"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Android: \`apps/native\` is unchanged since \`$previous\`; no patch cut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "apps/native changed since $previous; patching"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Android release configuration
        if: steps.change.outputs.changed == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SHOREBIRD_PATCH_PRIVATE_KEY: ${{ secrets.SHOREBIRD_PATCH_PRIVATE_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          missing=()
          # SHOREBIRD_TOKEN is an API key from console.shorebird.dev; the
          # other two are the patch signing key and the phone's existing
          # signer, both of which live only on Tim's machine otherwise.
          for name in \
            SHOREBIRD_TOKEN \
            SHOREBIRD_PATCH_PRIVATE_KEY \
            ANDROID_DEBUG_KEYSTORE_BASE64; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Android release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Java # zizmor: ignore[cache-poisoning] tag-only release job
        if: steps.change.outputs.changed == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install the qualified Shorebird CLI
        # The CLI is the version `apps/native/qualification.json` records: the
        # one the enabling release was built and qualified with. Shorebird's
        # own installer and setup action take whatever is current, and a
        # patch must be built with the release's tooling. The CLI brings its
        # own Flutter, so no `flutter-action` here.
        if: steps.change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          qualified() {
            python3 -c 'import json,sys; print(json.load(open("apps/native/qualification.json"))["shorebird"][sys.argv[1]])' "$1"
          }
          version="$(qualified cli)"
          git clone --quiet --depth 1 --branch "v$version" \
            https://github.com/shorebirdtech/shorebird.git "$RUNNER_TEMP/shorebird"
          echo "$RUNNER_TEMP/shorebird/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shorebird/bin/shorebird" --version

          # A Gradle build can shell out to `dart`: `rive_native`'s
          # `runRiveNativeSetup` task fetches its prebuilt `.so` files with
          # `sh -c "dart run rive_native:setup ..."`, and the CLI keeps its
          # Flutter to itself, so `dart` is otherwise absent and the build
          # dies with `sh: 1: dart: not found`.
          #
          # It has to be the release's Flutter, not whichever one the CLI
          # runs itself on. `apps/native/pubspec.yaml` pins `flutter` to one
          # exact version, so a newer SDK resolves as "version solving
          # failed" and the setup exits 255. `bin/internal/flutter.version`
          # is the CLI's own default and drifts ahead of the qualified one;
          # `shorebird.frameworkRevision` is the revision the enabling
          # release was built with, and names its directory under
          # `bin/cache/flutter`. `shorebird patch` downloads that SDK for
          # the release it is patching, so the directory appears during the
          # next step — `PATH` resolves at exec time, so exporting it before
          # it exists is fine.
          revision="$(qualified frameworkRevision)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'qualification.json records no Flutter revision: %s\n' "$revision" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/shorebird/bin/cache/flutter/$revision/bin" >> "$GITHUB_PATH"

      - name: Cut the patch to the staging track
        if: steps.change.outputs.changed == 'true'
        id: patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SHOREBIRD_PATCH_PRIVATE_KEY: ${{ secrets.SHOREBIRD_PATCH_PRIVATE_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/debug.keystore"
          key="$RUNNER_TEMP/shorebird-private.pem"
          trap 'rm -f "$keystore" "$key"' EXIT
          base64 -d <<<"$ANDROID_DEBUG_KEYSTORE_BASE64" > "$keystore"
          (umask 077; printf '%s\n' "$SHOREBIRD_PATCH_PRIVATE_KEY" > "$key")

          export FROCKBOT_ANDROID_KEYSTORE="$keystore"
          export NATIVE_SHOREBIRD_PRIVATE_KEY="$key"
          export NATIVE_UPDATE_STATE="$RUNNER_TEMP/native-updates"
          result="$RUNNER_TEMP/patch.json"

          # Exit status 3 is the script's own verdict, not a failure: the
          # change has native or asset differences, which only a full
          # release can carry. Say so and let the web release continue.
          status=0
          python3 scripts/native-update.py patch --baseline shorebird --track staging --result "$result" || status=$?
          if [[ $status -eq 3 ]]; then
            echo "::notice title=Android needs a full release::This tag changes native code, assets or plugins. Cut a full release with \`bun run native:release\` and install it once on the phone."
            echo "Android: **needs a full release** — Shorebird found changes a patch cannot carry. Run \`bun run native:release\` from this tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi

          release="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["release"])' "$result")"
          patch="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["patch"]["number"])' "$result")"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "Android: patch \`$patch\` on release \`$release\` is on the staging track; \`promote-android\` moves it to stable once the backend deploy lands." >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish packages
    # After the production deploy, not beside it: a package published for a
    # release whose deploy then failed would sit on npm ahead of a production
    # that never moved. (The deploy jobs name the `production` environment,
    # which carries no protection rule today; were one added, this ordering
    # would also keep npm behind the approval.)
    needs: [verify, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow only runs for maintainer-pushed version tags. The setup
      # actions do not restore dependency caches in this privileged job.
      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package versions
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          // The Applets SDK is the only published workspace: `packages/` is
          // gone, and nothing else in this repository has a consumer off it.
          const directories = [path.join('applets', 'sdk')];

          for (const directory of directories) {
            const file = path.join(directory, 'package.json');
            if (!fs.existsSync(file)) continue;
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (manifest.frockbot?.npm !== true) continue;
            manifest.version = process.env.VERSION;
            manifest.private = false;

            for (const section of [
              'dependencies',
              'devDependencies',
              'optionalDependencies',
              'peerDependencies',
            ]) {
              for (const [name, range] of Object.entries(manifest[section] ?? {})) {
                if (range === 'workspace:*') manifest[section][name] = process.env.VERSION;
                if (range === 'workspace:^') manifest[section][name] = `^${process.env.VERSION}`;
                if (range === 'workspace:~') manifest[section][name] = `~${process.env.VERSION}`;
              }
            }

            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Check npm can publish through OIDC
        # Publishing carries no registry token. npm exchanges this job's OIDC
        # identity for a short-lived credential, which it only does from
        # 11.5.1 onward; an older npm would fall back to unauthenticated
        # publishing and fail one package at a time. Fail here instead, where
        # the reason is legible, if a Node image ever ships an older npm.
        shell: bash
        run: |
          required=11.5.1
          installed="$(npm --version)"
          if [[ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -n 1)" != "$required" ]]; then
            echo "npm $installed cannot publish through OIDC; $required or later is required" >&2
            exit 1
          fi
          echo "npm $installed supports trusted publishing"

      - name: Publish packages
        # No NPM_TOKEN: each package names this repository and this workflow
        # file as its trusted publisher, and npm mints a short-lived
        # credential from the job's OIDC identity. A package whose trusted
        # publisher is unconfigured fails here with a 404 from the token
        # exchange, which reads as "package not found" but means "this
        # workflow is not trusted to publish it" — see the release runbook.
        # Provenance attestation is automatic under trusted publishing, so
        # --provenance is not passed.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -uo pipefail

          npm_tag_args=()
          if [[ "$VERSION" == *-* ]]; then
            npm_tag_args=(--tag next)
          fi
          export NPM_TAG_ARGS="${npm_tag_args[*]-}"

          publish_one() {
            local package_dir="${1%/}"
            local log status

            # Publishing from inside the package directory, rather than with
            # `--workspace` from the root, keeps npm from resolving every
            # workspace in the repository to pack one of them.
            log="$(cd "$package_dir" && npm publish --access public ${NPM_TAG_ARGS} 2>&1)"
            status=$?

            if (( status == 0 )); then
              printf '%s\n' "published $package_dir@$VERSION"
              return 0
            fi

            # A re-run of an interrupted release republishes everything. The
            # registry rejecting a version it already has is that re-run
            # working, not a failure — this replaces a per-package `npm view`
            # precheck that cost a round trip on every package to catch a case
            # that almost never happens.
            if grep -qE 'EPUBLISHCONFLICT|[Cc]annot publish over' <<<"$log"; then
              printf '%s\n' "$package_dir@$VERSION is already published; skipping"
              return 0
            fi

            printf '%s\n' "FAILED $package_dir@$VERSION" "$log" >&2
            return 1
          }
          # Only packages that declare `frockbot.npm` are published. Every
          # other package exists to build this product and has no consumer off
          # this repository; publishing them meant a release went red whenever
          # npm had no trusted publisher for one, while the deploy that
          # actually matters had already succeeded.
          published=()
          for package_dir in applets/sdk/; do
            if node -e "process.exit(require('./${package_dir}package.json').frockbot?.npm === true ? 0 : 1)" 2>/dev/null; then
              published+=("$package_dir")
            fi
          done

          if (( ${#published[@]} == 0 )); then
            echo "no package declares frockbot.npm; nothing to publish" >&2
            exit 1
          fi

          for package_dir in "${published[@]}"; do
            publish_one "$package_dir" || exit 1
          done

  macos-release:
    name: Build notarized macOS app
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      minimum_system: ${{ steps.bundle.outputs.minimum_system }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the qualified SDK by immutable framework revision. A privileged
      # tag job must not silently move to a newer Flutter release.
      - name: Check out qualified Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: 4cf24164269a5ebf0c16a028a00727d0e77bbb05
          path: .flutter-sdk
          persist-credentials: false
          # Flutter reads its own version from `git describe --tags`. A
          # shallow checkout without tags reports 0.0.0-unknown, and
          # `flutter pub get` then refuses the app's `flutter: "3.47.0"`
          # constraint (v0.7.16, run 34562782289). The 3.47.0 tag points at
          # the pinned revision, so fetching tags makes the SDK name itself.
          fetch-tags: true

      - name: Put Flutter on PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.flutter-sdk/bin/flutter" config --no-analytics
          "$GITHUB_WORKSPACE/.flutter-sdk/bin/flutter" precache --macos

      - name: Validate Apple release configuration
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          APPLE_NOTARIZATION_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          missing=()
          for name in \
            MACOS_DEVELOPER_ID_P12_BASE64 \
            MACOS_DEVELOPER_ID_P12_PASSWORD \
            MACOS_DEVELOPER_ID_PROFILE_BASE64 \
            APPLE_NOTARIZATION_ID \
            APPLE_NOTARIZATION_PASSWORD \
            SPARKLE_ED_PUBLIC_KEY \
            SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import importlib.util
          import os
          import sys

          spec = importlib.util.spec_from_file_location("mac_appcast", "scripts/mac-appcast.py")
          appcast = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(appcast)
          try:
              key = appcast.SigningKey(os.environ["SPARKLE_ED_PRIVATE_KEY"])
          except ValueError as error:
              sys.exit(f"SPARKLE_ED_PRIVATE_KEY is not a Sparkle EdDSA key: {error}")
          if key.public_base64 != os.environ["SPARKLE_ED_PUBLIC_KEY"].strip():
              sys.exit("SPARKLE_ED_PRIVATE_KEY does not match the SPARKLE_ED_PUBLIC_KEY the app is built with.")
          PY

      - name: Import Developer ID identity and profile
        id: signing
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/frockbot-developer-id.p12"
          profile_path="$RUNNER_TEMP/frockbot-developer-id.provisionprofile"
          profile_plist="$RUNNER_TEMP/frockbot-developer-id.plist"
          keychain_path="$RUNNER_TEMP/frockbot-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_BASE64" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(python3 - "$profile_plist" <<'PY'
          from datetime import datetime, timezone
          import plistlib
          import re
          import sys

          with open(sys.argv[1], "rb") as source:
              profile = plistlib.loads(source.read())
          team = "Q444L76529"
          bundle = "com.frockbot.mobile"
          entitlements = profile.get("Entitlements", {})
          failures = []
          if profile.get("TeamIdentifier") != [team]:
              failures.append("the profile belongs to a different Apple team")
          if "OSX" not in profile.get("Platform", []):
              failures.append("the profile is not for macOS")
          if profile.get("ProvisionedDevices"):
              failures.append("the profile is device-scoped, not Developer ID distribution")
          expires = profile.get("ExpirationDate")
          if not isinstance(expires, datetime) or expires.replace(tzinfo=timezone.utc) <= datetime.now(timezone.utc):
              failures.append("the profile is expired or has no valid expiration")
          if entitlements.get("com.apple.application-identifier") != f"{team}.{bundle}":
              failures.append("the profile does not authorize the FrockBot bundle identifier")
          domains = entitlements.get("com.apple.developer.associated-domains")
          if domains != "*" and (not isinstance(domains, list) or "applinks:bot.frockbot.com" not in domains):
              failures.append("the profile does not authorize the desktop login associated domain")
          groups = entitlements.get("keychain-access-groups", [])
          allowed_groups = {f"{team}.*", f"{team}.{bundle}"}
          if not isinstance(groups, list) or not allowed_groups.intersection(groups):
              failures.append("the profile does not authorize the protected Keychain group")
          uuid = profile.get("UUID", "")
          if not re.fullmatch(r"[0-9A-Fa-f-]{36}", uuid):
              failures.append("the profile has no valid UUID")
          if failures:
              raise SystemExit("Invalid macOS distribution profile: " + "; ".join(failures))
          print(uuid)
          PY
          )"

          modern_profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          legacy_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          modern_profile="$modern_profiles/$profile_uuid.provisionprofile"
          legacy_profile="$legacy_profiles/$profile_uuid.provisionprofile"
          mkdir -p "$modern_profiles" "$legacy_profiles"
          install -m 600 "$profile_path" "$modern_profile"
          install -m 600 "$profile_path" "$legacy_profile"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "$keychain_path"
          rm -f "$certificate_path" "$profile_path" "$profile_plist"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identities="$({ security find-identity -v -p codesigning "$keychain_path" || true; } \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)"/\1/p')"
          if [[ "$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')" != 1 ]]; then
            echo "The signing archive must contain exactly one Developer ID Application identity." >&2
            exit 1
          fi
          {
            echo "identity=$identities"
            echo "profile_uuid=$profile_uuid"
            echo "modern_profile=$modern_profile"
            echo "legacy_profile=$legacy_profile"
          } >> "$GITHUB_OUTPUT"

      - name: Build signed desktop app
        working-directory: apps/native
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # A prerelease follows the staging feed, so a tester who installs one
          # keeps receiving prereleases; a release follows the stable feed.
          if [[ "$VERSION" == *-* ]]; then
            feed="https://downloads.frockbot.com/mac/appcast-staging.xml"
          else
            feed="https://downloads.frockbot.com/mac/appcast.xml"
          fi
          python3 ../../scripts/check-native-pins.py
          flutter pub get --enforce-lockfile
          # The client carries no host of its own; `deployments/hosted.json` is
          # where the hosted origin is written (ADR 0028).
          origin="https://$(python3 -c '
          import json, pathlib
          profile = json.loads(pathlib.Path("../../deployments/hosted.json").read_text())
          print(profile["workers"]["app"]["hostnames"][0], end="")
          ')"
          flutter build macos \
            --release \
            --config-only \
            --no-pub \
            --build-name="${VERSION%%-*}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=FROCKBOT_ORIGIN="$origin"
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FrockBot.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/FrockBotDerivedData" \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM=Q444L76529 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            FROCKBOT_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            FROCKBOT_UPDATE_FEED_URL="$feed" \
            FROCKBOT_UPDATE_PUBLIC_KEY="$SPARKLE_ED_PUBLIC_KEY"

          # Xcode signs the embedded Sparkle framework but not the helpers
          # nested inside it, and notarization rejects any executable without
          # the Developer ID, a timestamp and the hardened runtime. Sign them
          # inside-out as Sparkle documents, then reseal the app with the
          # entitlements Xcode already gave it.
          app="$RUNNER_TEMP/FrockBot.xcarchive/Products/Applications/FrockBot.app"
          sparkle="$app/Contents/Frameworks/Sparkle.framework"
          test -d "$sparkle"
          sign() { codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp "$@"; }
          sign "$sparkle/Versions/B/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          sign "$sparkle/Versions/B/Autoupdate"
          sign "$sparkle/Versions/B/Updater.app"
          sign "$sparkle"
          sign --preserve-metadata=entitlements,requirements,flags "$app"

      - name: Verify Developer ID signature
        id: bundle
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/FrockBot.xcarchive/Products/Applications/FrockBot.app"
          entitlements="$RUNNER_TEMP/frockbot-entitlements.plist"
          embedded_profile="$RUNNER_TEMP/frockbot-embedded-profile.plist"
          test -f "$app/Contents/embedded.provisionprofile"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == com.frockbot.mobile ]]
          # The identity is build-setting driven (`FROCKBOT_DESKTOP_DEV` selects
          # the local FrockBot Dev build); the release must be the released app.
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" == FrockBot ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" == frockbot ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${VERSION%%-*}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" == "$GITHUB_RUN_NUMBER" ]]
          # The feed's build numbers are this run number; an app that cannot
          # name its feed and key would never update again, and a prerelease
          # baked against the stable feed would move its testers off staging
          # for good.
          if [[ "$VERSION" == *-* ]]; then
            expected_feed="https://downloads.frockbot.com/mac/appcast-staging.xml"
          else
            expected_feed="https://downloads.frockbot.com/mac/appcast.xml"
          fi
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" == "$expected_feed" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")" == "$SPARKLE_ED_PUBLIC_KEY" ]]
          codesign --verify --strict "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          security cms -D -i "$app/Contents/embedded.provisionprofile" > "$embedded_profile"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$embedded_profile")" == "$PROFILE_UUID" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          # Rive Native is statically linked and Dart resolves its C entry points
          # by name at runtime (`DynamicLibrary.process()`). An archive build
          # strips them unless `STRIP_STYLE = non-global` holds in
          # `macos/Runner/Configs/Release.xcconfig`; v0.7.87 shipped without them
          # and every Bot avatar surface drew Flutter's grey error box.
          for arch in arm64 x86_64; do
            symbols="$(nm -gU -arch "$arch" "$app/Contents/MacOS/FrockBot")"
            grep -q ' _makeRenderer$' <<< "$symbols" \
              || { echo "The $arch executable lost Rive Native's exported symbols (makeRenderer); the archive stripped them." >&2; exit 1; }
          done
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -F "Authority=$SIGNING_IDENTITY" <<< "$details"
          grep -F "TeamIdentifier=Q444L76529" <<< "$details"
          grep -F "flags=0x10000(runtime)" <<< "$details"
          codesign --display --entitlements "$entitlements" --xml "$app"
          python3 - "$entitlements" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as source:
              entitlements = plistlib.loads(source.read())
          if entitlements.get("com.apple.security.get-task-allow"):
              raise SystemExit("The distributable desktop app must not carry the debugger entitlement.")
          if entitlements.get("com.apple.developer.associated-domains") != ["applinks:bot.frockbot.com"]:
              raise SystemExit("The distributable desktop app lost its login associated domain.")
          groups = entitlements.get("keychain-access-groups", [])
          if not isinstance(groups, list) or "Q444L76529.com.frockbot.mobile" not in groups:
              raise SystemExit("The distributable desktop app lost its protected Keychain group.")
          PY
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          [[ -n "$minimum" ]]
          echo "minimum_system=$minimum" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple desktop app and disk image
        env:
          APPLE_NOTARIZATION_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/FrockBot.xcarchive/Products/Applications/FrockBot.app"
          submission="$RUNNER_TEMP/FrockBot-notarization.zip"
          dmg="$RUNNER_TEMP/FrockBot-macos.dmg"

          notarize() {
            local target="$1"
            local result
            result="$RUNNER_TEMP/$(basename "$target").notarization.json"
            set +e
            xcrun notarytool submit "$target" \
              --apple-id "$APPLE_NOTARIZATION_ID" \
              --password "$APPLE_NOTARIZATION_PASSWORD" \
              --team-id Q444L76529 \
              --wait \
              --output-format json > "$result"
            local submit_status=$?
            set -e
            local status
            status="$(plutil -extract status raw "$result" 2>/dev/null || true)"
            if (( submit_status != 0 )) || [[ "$status" != Accepted ]]; then
              cat "$result"
              local submission_id
              submission_id="$(plutil -extract id raw "$result" 2>/dev/null || true)"
              if [[ -n "$submission_id" ]]; then
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_NOTARIZATION_ID" \
                  --password "$APPLE_NOTARIZATION_PASSWORD" \
                  --team-id Q444L76529 || true
              fi
              return 1
            fi
          }

          # The app is notarized and stapled first so the copy inside the
          # image carries its own ticket; then the image is notarized and
          # stapled as its own artifact, which is what Apple expects of a
          # disk image that is the public download.
          ditto -c -k --keepParent "$app" "$submission"
          notarize "$submission"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          scripts/mac-dmg.sh "$app" "$dmg" "$SIGNING_IDENTITY"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

          # Prove the image the website will serve mounts and carries the
          # stapled app next to the Applications shortcut.
          mount="$RUNNER_TEMP/FrockBot-mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          test -L "$mount/Applications"
          xcrun stapler validate "$mount/FrockBot.app"
          codesign --verify --deep --strict "$mount/FrockBot.app"
          hdiutil detach "$mount" >/dev/null
          trap - EXIT

      - name: Upload notarized disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frockbot-macos-release
          path: ${{ runner.temp }}/FrockBot-macos.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove imported signing material
        if: always()
        env:
          LEGACY_PROFILE: ${{ steps.signing.outputs.legacy_profile }}
          MODERN_PROFILE: ${{ steps.signing.outputs.modern_profile }}
        shell: bash
        run: |
          if [[ -n "$LEGACY_PROFILE" ]]; then rm -f "$LEGACY_PROFILE"; fi
          if [[ -n "$MODERN_PROFILE" ]]; then rm -f "$MODERN_PROFILE"; fi
          security delete-keychain "$RUNNER_TEMP/frockbot-signing.keychain-db" 2>/dev/null || true

  github-release:
    name: Create GitHub release
    # A Release is the record that this tag shipped and the desktop download
    # surface, so it is created once production has actually moved — not behind
    # npm publishing (first-publish trust, OIDC).
    #
    # It does not wait to be complete. Notarization is the one step here that
    # depends on a third party answering, and it is the one that has failed:
    # seven times in the first three weeks, each of which skipped this job and
    # left a shipped tag with no Release at all — including the web client and
    # application artifact an installer needs and Apple has nothing to do with.
    # So `macos-release` is awaited but not required, and the disk image is
    # attached when it exists. `publish-download`, which exists to publish that
    # image, keeps its hard dependency; re-running this job after a later
    # notarization succeeds uploads the image to the Release already created.
    needs:
      [verify, deploy-marketing, deploy-backend, macos-release, release-assets]
    if: >-
      ${{ !cancelled()
      && needs.verify.result == 'success'
      && needs.deploy-marketing.result == 'success'
      && needs.deploy-backend.result == 'success'
      && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download notarized disk image
        # Absent when notarization failed; the release is still worth creating.
        # Tolerated only in that case: if `macos-release` succeeded the image
        # exists, so a download failure is a real fault and must fail the job.
        continue-on-error: ${{ needs.macos-release.result != 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frockbot-macos-release
          path: .release-assets

      - name: Download the installer's release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frockbot-release-assets
          path: .release-assets

      - name: Create GitHub release and attach its assets
        # The disk image is the per-tag provenance record: one immutable copy of
        # exactly what shipped under this tag. It is not what the website hands
        # out — `publish-download` writes that to R2 — so nothing here depends on
        # which Release GitHub considers `latest`.
        #
        # The other two are what an installer downloads for a tag, beside the
        # container images `publish-images` pushed: the web client it unpacks as
        # the app Worker's `assets` payload, and the application artifact it puts
        # in its own R2 bucket under that file's sha256. Neither can be built
        # without Flutter, which is the point of attaching them.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The two an installer cannot proceed without are required; the disk
          # image is attached when notarization produced one. A Release missing
          # only the Mac download is worth far more than no Release at all.
          assets=(
            ".release-assets/frockbot-web-client-$VERSION.zip"
            ".release-assets/frockbot-application-artifact-$VERSION.mjs"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          dmg=".release-assets/FrockBot-macos.dmg"
          if [ -f "$dmg" ]; then
            assets=("$dmg" "${assets[@]}")
          else
            echo "::warning::No notarized disk image for $GITHUB_REF_NAME; creating the Release without the Mac download. Re-run \`macos-release\` and then \`github-release\` to attach it."
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --generate-notes \
              --verify-tag
          fi

  publish-download:
    name: Publish the Mac download
    # What frockbot.com/download/mac actually hands a visitor. The disk image
    # goes to R2 under an immutable per-tag key first, and only once that
    # write succeeded does the `latest` pointer move — so a failed upload
    # leaves the previous release downloadable rather than half-replacing it.
    # This runs after production has moved, for the same reason the GitHub
    # release does: the download should never be newer than the backend it
    # talks to. A prerelease tag is archived under its own key and leaves the
    # pointer alone, matching what `releases/latest` used to do for us.
    needs: [verify, deploy-marketing, deploy-backend, macos-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://frockbot.com/download/mac

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Download notarized disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frockbot-macos-release
          path: .release-assets

      - name: Upload the disk image to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset=".release-assets/FrockBot-macos.dmg"
          test -f "$asset"

          bucket="frockbot-downloads"
          versioned="mac/FrockBot-macos-$VERSION.dmg"
          latest="mac/FrockBot-macos.dmg"

          # Content type and disposition are stored on the object: the R2
          # custom domain serves them straight back, so the file lands in
          # Downloads named FrockBot-macos.dmg whichever key served it.
          put() {
            bunx wrangler r2 object put "$bucket/$1" \
              --remote \
              --file "$asset" \
              --content-type application/x-apple-diskimage \
              --content-disposition 'attachment; filename="FrockBot-macos.dmg"' \
              --cache-control "$2"
          }

          # Immutable: this key names one build and never changes, so it can
          # be cached indefinitely.
          put "$versioned" "public, max-age=31536000, immutable"
          echo "Archived \`$versioned\`." >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERSION" == *-* ]]; then
            echo "::notice title=Prerelease::$VERSION is a prerelease; the download pointer still serves the previous release."
            echo "Download pointer: **unchanged** — \`$VERSION\` is a prerelease." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The pointer the website redirects to. Short cache so a release is
          # live in minutes, not whenever an edge copy happens to expire. The
          # zone's Browser Cache TTL acts as a floor and silently raises a
          # shorter max-age to its own value, so this alone does not guarantee
          # propagation — the purge below is what does.
          put "$latest" "public, max-age=300"
          echo "Download pointer: now \`$VERSION\` at https://frockbot.com/download/mac" >> "$GITHUB_STEP_SUMMARY"

      - name: Purge the cached download pointer
        # Overwriting the object in R2 does not evict the copies already at
        # the edge and in browsers. Without this, a release stays unreachable
        # behind a stale copy for as long as the cache says — and the check
        # below can pass against a point of presence that happens to have no
        # copy while others still serve the previous build. Only the mutable
        # pointer is purged; the versioned key never changes.
        if: ${{ !contains(needs.verify.outputs.version, '-') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The zone for frockbot.com. Not a secret, and it is pinned for the
          # same reason the account id is pinned in the Worker configs: the
          # release should fail loudly rather than act on a zone it guessed.
          zone="eaeb100c3d48f228cdb2309b5b8152cc"

          response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "content-type: application/json" \
            -d '{"files":["https://downloads.frockbot.com/mac/FrockBot-macos.dmg"]}')"

          if ! printf '%s' "$response" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)'; then
            echo 'Failed to purge the download pointer from cache.' >&2
            # The overwhelmingly likely cause, and invisible otherwise: the
            # upload above needs Workers R2 Storage, this needs Zone Cache
            # Purge, and a token can hold the first without the second.
            echo 'CLOUDFLARE_API_TOKEN may be missing the "Zone: Cache Purge" permission for frockbot.com.' >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo "Purged the cached download pointer." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the published download
        if: ${{ !contains(needs.verify.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset=".release-assets/FrockBot-macos.dmg"
          expected="$(wc -c < "$asset" | tr -d ' ')"

          # The redirect and the object are deployed by two different jobs
          # against two different systems. Following the site's own route end
          # to end is what proves a visitor gets this build, rather than a
          # stale pointer or a bucket that was never bound to its domain.
          for attempt in 1 2 3 4 5; do
            served="$(curl -fsSL --retry 3 --max-time 300 \
              -o /tmp/served.dmg -w '%{size_download}' \
              https://frockbot.com/download/mac)" && break
            echo "attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done

          if [[ "$served" != "$expected" ]]; then
            printf 'Published download is %s bytes, expected %s\n' "$served" "$expected" >&2
            exit 1
          fi
          if ! cmp -s /tmp/served.dmg "$asset"; then
            echo 'Published download does not match the notarized disk image' >&2
            exit 1
          fi
          echo "Verified https://frockbot.com/download/mac serves $VERSION ($expected bytes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the in-app update feed
        # Last, so a running app is only offered a disk image already archived
        # under its immutable key. Each feed names only the newest build, so an
        # app skips straight to it, and the script refuses to move a feed
        # backwards. A tag writes only the feed its own channel owns: a
        # prerelease staging, a release stable.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          MINIMUM_SYSTEM: ${{ needs.macos-release.outputs.minimum_system }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" || -z "$SPARKLE_ED_PUBLIC_KEY" ]]; then
            echo 'Missing SPARKLE_ED_PRIVATE_KEY secret or SPARKLE_ED_PUBLIC_KEY variable.' >&2
            exit 1
          fi
          # The feed's floor is the app's own, so raising the deployment target
          # cannot leave the feed offering the build to Macs that cannot run it.
          if [[ -z "$MINIMUM_SYSTEM" ]]; then
            echo 'The macOS build did not report its LSMinimumSystemVersion.' >&2
            exit 1
          fi
          asset=".release-assets/FrockBot-macos.dmg"
          bucket="frockbot-downloads"
          url="https://downloads.frockbot.com/mac/FrockBot-macos-$VERSION.dmg"
          zone="eaeb100c3d48f228cdb2309b5b8152cc"

          publish() {
            local name="$1"
            local current="$RUNNER_TEMP/current-$name" next="$RUNNER_TEMP/$name"
            local log="$RUNNER_TEMP/current-$name.log"
            rm -f "$current" "$next" "$log"
            # Read the bucket, not the edge: a stale cached copy must not let
            # an older build overwrite a newer feed. Only a feed that is really
            # absent counts as empty; any other read failure stops the publish,
            # because a feed we could not read cannot be compared against.
            if ! bunx wrangler r2 object get "$bucket/mac/$name" --remote --file "$current" > "$log" 2>&1; then
              rm -f "$current"
              if ! grep -qF 'does not exist' "$log"; then
                cat "$log" >&2
                echo "Could not read the current $name from R2; refusing to overwrite it." >&2
                return 1
              fi
            fi
            python3 scripts/mac-appcast.py --archive "$asset" --version "$VERSION" \
              --build "$GITHUB_RUN_NUMBER" --url "$url" --minimum-system "$MINIMUM_SYSTEM" \
              --current "$current" --output "$next"
            bunx wrangler r2 object put "$bucket/mac/$name" --remote --file "$next" \
              --content-type application/xml --cache-control "public, max-age=300"
            printf '{"files":["https://downloads.frockbot.com/mac/%s"]}' "$name" > "$RUNNER_TEMP/purge.json"
            local response
            response="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
              -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              --data "@$RUNNER_TEMP/purge.json")"
            if ! printf '%s' "$response" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)'; then
              echo "Failed to purge $name from cache." >&2
              # The overwhelmingly likely cause, and invisible otherwise: the
              # upload above needs Workers R2 Storage, this needs Zone Cache
              # Purge, and a token can hold the first without the second.
              echo 'CLOUDFLARE_API_TOKEN may be missing the "Zone: Cache Purge" permission for frockbot.com.' >&2
              printf '%s\n' "$response" >&2
              return 1
            fi
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "https://downloads.frockbot.com/mac/$name" | cmp -s - "$next"; then
                echo "Update feed $name now offers $VERSION (build $GITHUB_RUN_NUMBER)." >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              sleep 15
            done
            echo "The served $name does not match what was published." >&2
            return 1
          }

          if [[ "$VERSION" == *-* ]]; then
            publish appcast-staging.xml
          else
            publish appcast.xml
          fi

  deploy-marketing:
    name: Deploy marketing site and admin portal
    # Production follows the tag, not the branch: merging to main integrates
    # code, and a version tag is what ships it. Both deploys wait on the
    # verify gate, so the riskiest step of a release still runs only against
    # code that typechecks, tests and builds. Both also declare the
    # `production` environment. It carries no protection rule, so nothing is
    # held here and a green `main` reaches bot.frockbot.com on its own; the
    # environment is named so that adding a required reviewer later is the
    # only change needed to put a person back in the path.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://frockbot.com

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Write production deployment configuration
        run: bun run deployment:config hosted

      - name: Prove the generated configs are what production runs
        run: bun test scripts/deployment-config.test.ts

      - name: Deploy frockbot.com
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler deploy
          -c ../../.deployment/hosted/marketing/wrangler.jsonc

      - name: Deploy admin.frockbot.com
        # The deployment's whole administrative surface (ADR 0028). It reaches
        # the app over a service binding, so it is deployed beside marketing
        # rather than with the backend: the binding names the app Worker, which
        # already exists, and a portal deployed against the previous version
        # administers it exactly as well.
        #
        # Access is what guards it, and the portal verifies the assertion
        # itself, so the audience tag and team domain are configuration it
        # cannot do without: until the environment names them, there is no
        # Access application in front of the hostname and deploying the Worker
        # would publish an administrative surface nothing guards.
        working-directory: apps/admin-portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ACCESS_TEAM_DOMAIN" && -z "$ACCESS_AUD" ]]; then
            echo "ACCESS_TEAM_DOMAIN and ACCESS_AUD are unset: skipping the admin portal."
            echo "Create the Cloudflare Access application for admin.frockbot.com and set both in the production environment to deploy it."
            exit 0
          fi

          missing=()
          for name in ACCESS_TEAM_DOMAIN ACCESS_AUD FROCKBOT_ADMIN_EMAILS; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing admin portal configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          secrets_file="$RUNNER_TEMP/frockbot-admin-portal.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          const names = ['ACCESS_TEAM_DOMAIN', 'ACCESS_AUD', 'FROCKBOT_ADMIN_EMAILS'];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy \
            -c ../../.deployment/hosted/admin-portal/wrangler.jsonc \
            --secrets-file "$secrets_file"

  deploy-backend:
    name: Deploy FrockBot app
    # Does not wait on `publish-images` yet: the hosted deploy builds its own
    # images from the Dockerfiles, and a tag must keep shipping frockbot.com
    # while the Docker Hub secrets are unset. Once the simple profile is
    # announced, add `publish-images` here so a tag production runs is always a
    # tag an installer can install (ADR 0028 step 5).
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.BETTER_AUTH_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          BILLING_MODEL_RATES: ${{ secrets.BILLING_MODEL_RATES }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APPLET_VIEWER_SECRET: ${{ secrets.APPLET_VIEWER_SECRET }}
          APPLET_BUILD_TOKEN: ${{ secrets.APPLET_BUILD_TOKEN }}
          # The manifest requires both voice keys; the deploy step below
          # already passes them. Without them here the check reported them
          # missing on every release (v0.7.16, run 34562782289) even though
          # production has them.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          FROCK_AI_GATEWAY_TOKEN: ${{ secrets.FROCK_AI_GATEWAY_TOKEN || secrets.FLOCK_AI_GATEWAY_TOKEN }}
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          # Every Worker secret is checked against one manifest, here rather
          # than in a list written out by hand in this file: a secret the code
          # requires and production has never had is what kept every published
          # Applet at 503 for weeks (2026-09-05). Failing here, before
          # anything is built, names the secret and what it costs.
          bun scripts/check-production-secrets.ts check || exit 1

          bun -e '
            import { parseCredentialKeyringV1 } from "./core/connection/index.ts";
            parseCredentialKeyringV1(process.env.CREDENTIAL_KEYRING ?? "");
          '
      # `deployments/hosted.json` is production's identity, including the
      # `AUTH_DB` database it has always had. This writes the configs every
      # wrangler command below reads, then proves they are still what production
      # runs: a Worker name, Durable Object class or migration tag that differed
      # here would be a new namespace, which is data loss.
      - name: Write production deployment configuration
        run: bun run deployment:config hosted

      - name: Prove the generated configs are what production runs
        run: bun test scripts/deployment-config.test.ts

      # The Flutter Web client is part of the app Worker's `assets` payload, so
      # its build must happen before `wrangler deploy` below. `artifact:build`
      # already chains it — `client:build` runs `flutter build web` in
      # `apps/native` and stages `apps/cloudflare/dist/web` — so this step only
      # has to make the pinned SDK present. Same pin as `native.yml`; no cache
      # in this privileged tag-only job.
      - name: Set up Flutter # zizmor: ignore[cache-poisoning] tag-only release job
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable

      - name: Build application artifact
        working-directory: apps/cloudflare
        run: bun run artifact:build

      - name: Configure application artifact
        id: artifact
        working-directory: apps/cloudflare
        run: |
          artifact_hash="$(sha256sum dist/artifacts/foundation-v1.mjs | cut -d ' ' -f 1)"
          echo "hash=$artifact_hash" >> "$GITHUB_OUTPUT"
          ARTIFACT_HASH="$artifact_hash" node <<'NODE'
          const fs = require('node:fs');
          const file = '../../.deployment/hosted/app/wrangler.jsonc';
          const placeholder = 'foundation-v1';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(placeholder)) {
            throw new Error(`${file} no longer contains the default application hash ${placeholder}`);
          }
          fs.writeFileSync(file, source.replaceAll(placeholder, process.env.ARTIFACT_HASH));
          NODE

      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler d1 migrations apply frockbot-auth
          -c ../../.deployment/hosted/app/wrangler.jsonc --remote

      - name: Upload application artifact
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler r2 object put
          frockbot-application-artifacts/applications/${{ steps.artifact.outputs.hash }}.mjs
          --file dist/artifacts/foundation-v1.mjs
          -c ../../.deployment/hosted/app/wrangler.jsonc
          --remote

      - name: Deploy computer host
        # The app's COMPUTER_HOST service binding names this Worker, so it
        # must exist before the app version can be created; and the host must
        # be current before the app that calls it (ADR 0004, risk v). Wrangler
        # builds and pushes the container image here, which needs Docker — the
        # hosted runner has it.
        working-directory: apps/computer-host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-computer-host.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          const names = ['SPRITES_TOKEN', 'COMPUTER_HOST_TOKEN'];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy \
            -c ../../.deployment/hosted/computer-host/wrangler.jsonc \
            --secrets-file "$secrets_file"

      - name: Deploy Applet build service
        # The app's APPLET_BUILD service binding names this Worker, so it must
        # exist before the app version can be created. Wrangler builds and
        # pushes the container image here, which needs Docker — the hosted
        # runner has it.
        working-directory: apps/applet-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLET_BUILD_TOKEN: ${{ secrets.APPLET_BUILD_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-applet-build.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          const names = ['APPLET_BUILD_TOKEN'];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy \
            -c ../../.deployment/hosted/applet-build/wrangler.jsonc \
            --secrets-file "$secrets_file"

      - name: Verify billing launch readiness
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          BILLING_MODEL_RATES: ${{ secrets.BILLING_MODEL_RATES }}
        run: bun scripts/check-billing-release.ts

      - name: Deploy Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
          # Required: signs the viewer token an open Applet's page presents.
          # Absent, every published Applet answers 503 — which is exactly what
          # production did, unnoticed, from the day the Applet authority
          # shipped until 2026-09-05.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          BILLING_MODEL_RATES: ${{ secrets.BILLING_MODEL_RATES }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APPLET_VIEWER_SECRET: ${{ secrets.APPLET_VIEWER_SECRET }}
          # Required: the same shared secret the Applet build Worker and its
          # container check. A Turn's applet_check and applet_publish both call
          # the service, so without it no Applet can be built or published.
          APPLET_BUILD_TOKEN: ${{ secrets.APPLET_BUILD_TOKEN }}
          # Required: the composer's dictation upstream (OpenAI Realtime) and
          # the voice session's speech (ElevenLabs). The hosted product must
          # work with zero User configuration, so a release without either
          # stops here rather than shipping a microphone that answers "not
          # set up" (docs/voice.md).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Optional: authorizes the read-only /api/debug operator surface.
          # Absent and the deployed Worker simply 404s those routes.
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          # Optional: the `cf-aig-authorization` bearer for the AI Gateway.
          # Present, Frock AI takes the compat HTTP transport, the only one
          # that accepts the `dynamic/<route>` Auto model (cloudflare/ai#617).
          # Absent, it falls back to the `AI` binding and Auto fails.
          # Falls back to the pre-rename repository secret until that one is
          # re-added as FROCK_AI_GATEWAY_TOKEN; `--secrets-file` replaces the
          # Worker's whole secret set, so an unresolved name would delete it.
          FROCK_AI_GATEWAY_TOKEN: ${{ secrets.FROCK_AI_GATEWAY_TOKEN || secrets.FLOCK_AI_GATEWAY_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-production.env"
          trap 'rm -f "$secrets_file"' EXIT

          # The last gate before production. It reads the same manifest the
          # secrets file is written from, so what is checked and what is
          # deployed cannot drift; `--live` also compares the deployed
          # Worker's own secret list, because `--secrets-file` replaces the
          # whole set and would silently delete anything set by hand.
          bun "$GITHUB_WORKSPACE/scripts/check-production-secrets.ts" check --live || exit 1

          # Names, values, and the JSON encoding all come from the manifest:
          # wrangler reads a secrets file as JSON first and only falls back to
          # dotenv, and a dotenv line keeps the backslash escapes inside a
          # double-quoted value — so a secret that is itself JSON (the
          # credential keyring) would reach the Worker mangled.
          bun "$GITHUB_WORKSPACE/scripts/check-production-secrets.ts" write-secrets-file "$secrets_file" || exit 1

          bunx wrangler deploy \
            -c ../../.deployment/hosted/app/wrangler.jsonc \
            --secrets-file "$secrets_file"

  promote-android:
    name: Promote Android patch
    # What deploys production is what promotes the patch: this job waits on
    # `deploy-backend`, so a patched client never runs ahead of the server it
    # was built against. It declares no environment of its own, so if
    # `production` is ever given a required reviewer, that one approval still
    # covers both. Skipped when no patch was cut.
    needs: [patch-android, deploy-backend]
    if: needs.patch-android.outputs.patch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the qualified Shorebird CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("apps/native/qualification.json"))["shorebird"]["cli"])')"
          git clone --quiet --depth 1 --branch "v$version" \
            https://github.com/shorebirdtech/shorebird.git "$RUNNER_TEMP/shorebird"
          echo "$RUNNER_TEMP/shorebird/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shorebird/bin/shorebird" --version

      - name: Promote the patch to stable
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE: ${{ needs.patch-android.outputs.release }}
          PATCH: ${{ needs.patch-android.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native-update.py promote --release-version "$RELEASE" --patch-number "$PATCH"
          echo "Android: patch \`$PATCH\` on release \`$RELEASE\` is stable. Open the app on the phone twice and confirm the change is live." >> "$GITHUB_STEP_SUMMARY"
