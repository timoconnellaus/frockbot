name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # `main.yml` cuts the next patch tag once staging is green and starts this
  # workflow for it by name: a tag it creates with `GITHUB_TOKEN` raises no
  # `push` event. Run it with `--ref <tag>`, so `GITHUB_REF_NAME` is the tag
  # here exactly as it is for a tag pushed by hand.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    name: Verify the release tag
    # The gate every other job waits on. Publishing to npm and deploying to
    # production both depend on this passing, but not on each other: nothing
    # deployed here installs the published packages, they are built from the
    # source in this checkout. Keeping npm publishing off this critical path
    # is what lets a deploy start as soon as the code is known good.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only `publish-npm` needs the OIDC identity that npm trusts, and only it
    # needs write. This job builds and runs the test suite, so it takes the
    # narrowest permissions of the four.
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow only runs for maintainer-pushed version tags. The setup
      # actions do not restore dependency caches in this privileged job.
      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
          if (!semver.test(version)) {
            console.error(`Invalid release tag: ${process.env.GITHUB_REF_NAME}`);
            if (version.includes('+')) {
              console.error('npm does not accept SemVer build metadata in package versions.');
            }
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # `build` reaches `artifact:build`, whose first step is `flutter build
      # web` in `apps/native` — the web client is Flutter Web. Pinned to the
      # revision `apps/native/qualification.json` records and `native.yml`
      # checks for. No cache in this privileged tag-only job, for the same
      # reason the Bun and Node setups above restore none.
      - name: Set up Flutter # zizmor: ignore[cache-poisoning] tag-only release job
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable

      - name: Build
        run: bun run build

  patch-android:
    name: Cut Android patch
    # The phone app's half of the release. A full Android release — a new APK
    # with Shorebird's engine, the patch public key baked in and the phone's
    # existing signer — is cut by hand with `bun run native:release` and
    # installed once, because it needs the phone and the Tailscale download
    # service (`apps/native/README.md`). Everything Dart ships from here: a
    # signed patch against the newest active release Shorebird reports, on
    # the staging track, and `promote-android` moves it to stable with the
    # production approval. Nothing deployed here waits on this job, so a red
    # patch never blocks the web release; a tag whose `apps/native` matches
    # the previous release tag has nothing to patch and says so.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      release: ${{ steps.patch.outputs.release }}
      patch: ${{ steps.patch.outputs.patch }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous release tag is what "changed" is measured against.
          fetch-depth: 0

      - name: Compare the app with the previous release
        id: change
        shell: bash
        run: |
          set -euo pipefail
          # The tag before this one in version order. A hand-cut minor or
          # prerelease tag compares with whatever it followed, like the
          # automatic patch cut does.
          previous="$(git tag --list 'v[0-9]*' --sort=version:refname \
            | grep -B1 -Fx "$GITHUB_REF_NAME" | head -n 1)"
          if [[ -z "$previous" || "$previous" == "$GITHUB_REF_NAME" ]]; then
            echo "no earlier release tag; patching"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$previous" HEAD -- apps/native; then
            echo "apps/native is unchanged since $previous; nothing to patch"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Android: \`apps/native\` is unchanged since \`$previous\`; no patch cut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "apps/native changed since $previous; patching"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Android release configuration
        if: steps.change.outputs.changed == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SHOREBIRD_PATCH_PRIVATE_KEY: ${{ secrets.SHOREBIRD_PATCH_PRIVATE_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          missing=()
          # SHOREBIRD_TOKEN is an API key from console.shorebird.dev; the
          # other two are the patch signing key and the phone's existing
          # signer, both of which live only on Tim's machine otherwise.
          for name in \
            SHOREBIRD_TOKEN \
            SHOREBIRD_PATCH_PRIVATE_KEY \
            ANDROID_DEBUG_KEYSTORE_BASE64; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Android release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Java # zizmor: ignore[cache-poisoning] tag-only release job
        if: steps.change.outputs.changed == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install the qualified Shorebird CLI
        # The CLI is the version `apps/native/qualification.json` records: the
        # one the enabling release was built and qualified with. Shorebird's
        # own installer and setup action take whatever is current, and a
        # patch must be built with the release's tooling. The CLI brings its
        # own Flutter, so no `flutter-action` here.
        if: steps.change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("apps/native/qualification.json"))["shorebird"]["cli"])')"
          git clone --quiet --depth 1 --branch "v$version" \
            https://github.com/shorebirdtech/shorebird.git "$RUNNER_TEMP/shorebird"
          echo "$RUNNER_TEMP/shorebird/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shorebird/bin/shorebird" --version

      - name: Cut the patch to the staging track
        if: steps.change.outputs.changed == 'true'
        id: patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SHOREBIRD_PATCH_PRIVATE_KEY: ${{ secrets.SHOREBIRD_PATCH_PRIVATE_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/debug.keystore"
          key="$RUNNER_TEMP/shorebird-private.pem"
          trap 'rm -f "$keystore" "$key"' EXIT
          base64 -d <<<"$ANDROID_DEBUG_KEYSTORE_BASE64" > "$keystore"
          (umask 077; printf '%s\n' "$SHOREBIRD_PATCH_PRIVATE_KEY" > "$key")

          export FROCKBOT_ANDROID_KEYSTORE="$keystore"
          export NATIVE_SHOREBIRD_PRIVATE_KEY="$key"
          export NATIVE_UPDATE_STATE="$RUNNER_TEMP/native-updates"
          result="$RUNNER_TEMP/patch.json"

          # Exit status 3 is the script's own verdict, not a failure: the
          # change has native or asset differences, which only a full
          # release can carry. Say so and let the web release continue.
          status=0
          python3 scripts/native-update.py patch --baseline shorebird --track staging --result "$result" || status=$?
          if [[ $status -eq 3 ]]; then
            echo "::notice title=Android needs a full release::This tag changes native code, assets or plugins. Cut a full release with \`bun run native:release\` and install it once on the phone."
            echo "Android: **needs a full release** — Shorebird found changes a patch cannot carry. Run \`bun run native:release\` from this tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi

          release="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["release"])' "$result")"
          patch="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["patch"]["number"])' "$result")"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "Android: patch \`$patch\` on release \`$release\` is on the staging track; the production approval promotes it to stable." >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish packages
    # After the production deploy, not beside it. The deploy jobs wait on the
    # `production` environment's approval, and a package published for a
    # release nobody approved would sit on npm ahead of a production that
    # never moved.
    needs: [verify, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow only runs for maintainer-pushed version tags. The setup
      # actions do not restore dependency caches in this privileged job.
      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package versions
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          // The Applets SDK is the only published workspace: `packages/` is
          // gone, and nothing else in this repository has a consumer off it.
          const directories = [path.join('applets', 'sdk')];

          for (const directory of directories) {
            const file = path.join(directory, 'package.json');
            if (!fs.existsSync(file)) continue;
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (manifest.frockbot?.npm !== true) continue;
            manifest.version = process.env.VERSION;
            manifest.private = false;

            for (const section of [
              'dependencies',
              'devDependencies',
              'optionalDependencies',
              'peerDependencies',
            ]) {
              for (const [name, range] of Object.entries(manifest[section] ?? {})) {
                if (range === 'workspace:*') manifest[section][name] = process.env.VERSION;
                if (range === 'workspace:^') manifest[section][name] = `^${process.env.VERSION}`;
                if (range === 'workspace:~') manifest[section][name] = `~${process.env.VERSION}`;
              }
            }

            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Check npm can publish through OIDC
        # Publishing carries no registry token. npm exchanges this job's OIDC
        # identity for a short-lived credential, which it only does from
        # 11.5.1 onward; an older npm would fall back to unauthenticated
        # publishing and fail one package at a time. Fail here instead, where
        # the reason is legible, if a Node image ever ships an older npm.
        shell: bash
        run: |
          required=11.5.1
          installed="$(npm --version)"
          if [[ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -n 1)" != "$required" ]]; then
            echo "npm $installed cannot publish through OIDC; $required or later is required" >&2
            exit 1
          fi
          echo "npm $installed supports trusted publishing"

      - name: Publish packages
        # No NPM_TOKEN: each package names this repository and this workflow
        # file as its trusted publisher, and npm mints a short-lived
        # credential from the job's OIDC identity. A package whose trusted
        # publisher is unconfigured fails here with a 404 from the token
        # exchange, which reads as "package not found" but means "this
        # workflow is not trusted to publish it" — see the release runbook.
        # Provenance attestation is automatic under trusted publishing, so
        # --provenance is not passed.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -uo pipefail

          npm_tag_args=()
          if [[ "$VERSION" == *-* ]]; then
            npm_tag_args=(--tag next)
          fi
          export NPM_TAG_ARGS="${npm_tag_args[*]-}"

          publish_one() {
            local package_dir="${1%/}"
            local log status

            # Publishing from inside the package directory, rather than with
            # `--workspace` from the root, keeps npm from resolving every
            # workspace in the repository to pack one of them.
            log="$(cd "$package_dir" && npm publish --access public ${NPM_TAG_ARGS} 2>&1)"
            status=$?

            if (( status == 0 )); then
              printf '%s\n' "published $package_dir@$VERSION"
              return 0
            fi

            # A re-run of an interrupted release republishes everything. The
            # registry rejecting a version it already has is that re-run
            # working, not a failure — this replaces a per-package `npm view`
            # precheck that cost a round trip on every package to catch a case
            # that almost never happens.
            if grep -qE 'EPUBLISHCONFLICT|[Cc]annot publish over' <<<"$log"; then
              printf '%s\n' "$package_dir@$VERSION is already published; skipping"
              return 0
            fi

            printf '%s\n' "FAILED $package_dir@$VERSION" "$log" >&2
            return 1
          }
          # Only packages that declare `frockbot.npm` are published. Every
          # other package exists to build this product and has no consumer off
          # this repository; publishing them meant a release went red whenever
          # npm had no trusted publisher for one, while the deploy that
          # actually matters had already succeeded.
          published=()
          for package_dir in applets/sdk/; do
            if node -e "process.exit(require('./${package_dir}package.json').frockbot?.npm === true ? 0 : 1)" 2>/dev/null; then
              published+=("$package_dir")
            fi
          done

          if (( ${#published[@]} == 0 )); then
            echo "no package declares frockbot.npm; nothing to publish" >&2
            exit 1
          fi

          for package_dir in "${published[@]}"; do
            publish_one "$package_dir" || exit 1
          done

  macos-release:
    name: Build notarized macOS app
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the qualified SDK by immutable framework revision. A privileged
      # tag job must not silently move to a newer Flutter release.
      - name: Check out qualified Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: 4cf24164269a5ebf0c16a028a00727d0e77bbb05
          path: .flutter-sdk
          persist-credentials: false
          # Flutter reads its own version from `git describe --tags`. A
          # shallow checkout without tags reports 0.0.0-unknown, and
          # `flutter pub get` then refuses the app's `flutter: "3.47.0"`
          # constraint (v0.7.16, run 34562782289). The 3.47.0 tag points at
          # the pinned revision, so fetching tags makes the SDK name itself.
          fetch-tags: true

      - name: Put Flutter on PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.flutter-sdk/bin/flutter" config --no-analytics
          "$GITHUB_WORKSPACE/.flutter-sdk/bin/flutter" precache --macos

      - name: Validate Apple release configuration
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          APPLE_NOTARIZATION_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in \
            MACOS_DEVELOPER_ID_P12_BASE64 \
            MACOS_DEVELOPER_ID_P12_PASSWORD \
            MACOS_DEVELOPER_ID_PROFILE_BASE64 \
            APPLE_NOTARIZATION_ID \
            APPLE_NOTARIZATION_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID identity and profile
        id: signing
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/frockbot-developer-id.p12"
          profile_path="$RUNNER_TEMP/frockbot-developer-id.provisionprofile"
          profile_plist="$RUNNER_TEMP/frockbot-developer-id.plist"
          keychain_path="$RUNNER_TEMP/frockbot-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_BASE64" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(python3 - "$profile_plist" <<'PY'
          from datetime import datetime, timezone
          import plistlib
          import re
          import sys

          with open(sys.argv[1], "rb") as source:
              profile = plistlib.loads(source.read())
          team = "Q444L76529"
          bundle = "com.frockbot.mobile"
          entitlements = profile.get("Entitlements", {})
          failures = []
          if profile.get("TeamIdentifier") != [team]:
              failures.append("the profile belongs to a different Apple team")
          if "OSX" not in profile.get("Platform", []):
              failures.append("the profile is not for macOS")
          if profile.get("ProvisionedDevices"):
              failures.append("the profile is device-scoped, not Developer ID distribution")
          expires = profile.get("ExpirationDate")
          if not isinstance(expires, datetime) or expires.replace(tzinfo=timezone.utc) <= datetime.now(timezone.utc):
              failures.append("the profile is expired or has no valid expiration")
          if entitlements.get("com.apple.application-identifier") != f"{team}.{bundle}":
              failures.append("the profile does not authorize the FrockBot bundle identifier")
          domains = entitlements.get("com.apple.developer.associated-domains")
          if domains != "*" and (not isinstance(domains, list) or "applinks:bot.frockbot.com" not in domains):
              failures.append("the profile does not authorize the desktop login associated domain")
          groups = entitlements.get("keychain-access-groups", [])
          allowed_groups = {f"{team}.*", f"{team}.{bundle}"}
          if not isinstance(groups, list) or not allowed_groups.intersection(groups):
              failures.append("the profile does not authorize the protected Keychain group")
          uuid = profile.get("UUID", "")
          if not re.fullmatch(r"[0-9A-Fa-f-]{36}", uuid):
              failures.append("the profile has no valid UUID")
          if failures:
              raise SystemExit("Invalid macOS distribution profile: " + "; ".join(failures))
          print(uuid)
          PY
          )"

          modern_profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          legacy_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          modern_profile="$modern_profiles/$profile_uuid.provisionprofile"
          legacy_profile="$legacy_profiles/$profile_uuid.provisionprofile"
          mkdir -p "$modern_profiles" "$legacy_profiles"
          install -m 600 "$profile_path" "$modern_profile"
          install -m 600 "$profile_path" "$legacy_profile"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "$keychain_path"
          rm -f "$certificate_path" "$profile_path" "$profile_plist"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identities="$({ security find-identity -v -p codesigning "$keychain_path" || true; } \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)"/\1/p')"
          if [[ "$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')" != 1 ]]; then
            echo "The signing archive must contain exactly one Developer ID Application identity." >&2
            exit 1
          fi
          {
            echo "identity=$identities"
            echo "profile_uuid=$profile_uuid"
            echo "modern_profile=$modern_profile"
            echo "legacy_profile=$legacy_profile"
          } >> "$GITHUB_OUTPUT"

      - name: Build signed desktop app
        working-directory: apps/native
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/check-native-pins.py
          flutter pub get --enforce-lockfile
          flutter build macos \
            --release \
            --config-only \
            --no-pub \
            --build-name="${VERSION%%-*}" \
            --build-number="$GITHUB_RUN_NUMBER"
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FrockBot.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/FrockBotDerivedData" \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM=Q444L76529 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            FROCKBOT_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS=--timestamp

      - name: Verify Developer ID signature
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/FrockBot.xcarchive/Products/Applications/FrockBot.app"
          entitlements="$RUNNER_TEMP/frockbot-entitlements.plist"
          embedded_profile="$RUNNER_TEMP/frockbot-embedded-profile.plist"
          test -f "$app/Contents/embedded.provisionprofile"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == com.frockbot.mobile ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${VERSION%%-*}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" == "$GITHUB_RUN_NUMBER" ]]
          security cms -D -i "$app/Contents/embedded.provisionprofile" > "$embedded_profile"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$embedded_profile")" == "$PROFILE_UUID" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -F "Authority=$SIGNING_IDENTITY" <<< "$details"
          grep -F "TeamIdentifier=Q444L76529" <<< "$details"
          grep -F "flags=0x10000(runtime)" <<< "$details"
          codesign --display --entitlements "$entitlements" --xml "$app"
          python3 - "$entitlements" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as source:
              entitlements = plistlib.loads(source.read())
          if entitlements.get("com.apple.security.get-task-allow"):
              raise SystemExit("The distributable desktop app must not carry the debugger entitlement.")
          if entitlements.get("com.apple.developer.associated-domains") != ["applinks:bot.frockbot.com"]:
              raise SystemExit("The distributable desktop app lost its login associated domain.")
          groups = entitlements.get("keychain-access-groups", [])
          if not isinstance(groups, list) or "Q444L76529.com.frockbot.mobile" not in groups:
              raise SystemExit("The distributable desktop app lost its protected Keychain group.")
          PY

      - name: Notarize and staple desktop app and disk image
        env:
          APPLE_NOTARIZATION_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/FrockBot.xcarchive/Products/Applications/FrockBot.app"
          submission="$RUNNER_TEMP/FrockBot-notarization.zip"
          dmg="$RUNNER_TEMP/FrockBot-macos.dmg"

          notarize() {
            local target="$1"
            local result
            result="$RUNNER_TEMP/$(basename "$target").notarization.json"
            set +e
            xcrun notarytool submit "$target" \
              --apple-id "$APPLE_NOTARIZATION_ID" \
              --password "$APPLE_NOTARIZATION_PASSWORD" \
              --team-id Q444L76529 \
              --wait \
              --output-format json > "$result"
            local submit_status=$?
            set -e
            local status
            status="$(plutil -extract status raw "$result" 2>/dev/null || true)"
            if (( submit_status != 0 )) || [[ "$status" != Accepted ]]; then
              cat "$result"
              local submission_id
              submission_id="$(plutil -extract id raw "$result" 2>/dev/null || true)"
              if [[ -n "$submission_id" ]]; then
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_NOTARIZATION_ID" \
                  --password "$APPLE_NOTARIZATION_PASSWORD" \
                  --team-id Q444L76529 || true
              fi
              return 1
            fi
          }

          # The app is notarized and stapled first so the copy inside the
          # image carries its own ticket; then the image is notarized and
          # stapled as its own artifact, which is what Apple expects of a
          # disk image that is the public download.
          ditto -c -k --keepParent "$app" "$submission"
          notarize "$submission"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          scripts/mac-dmg.sh "$app" "$dmg" "$SIGNING_IDENTITY"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

          # Prove the image the website will serve mounts and carries the
          # stapled app next to the Applications shortcut.
          mount="$RUNNER_TEMP/FrockBot-mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          test -L "$mount/Applications"
          xcrun stapler validate "$mount/FrockBot.app"
          codesign --verify --deep --strict "$mount/FrockBot.app"
          hdiutil detach "$mount" >/dev/null
          trap - EXIT

      - name: Upload notarized disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frockbot-macos-release
          path: ${{ runner.temp }}/FrockBot-macos.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove imported signing material
        if: always()
        env:
          LEGACY_PROFILE: ${{ steps.signing.outputs.legacy_profile }}
          MODERN_PROFILE: ${{ steps.signing.outputs.modern_profile }}
        shell: bash
        run: |
          if [[ -n "$LEGACY_PROFILE" ]]; then rm -f "$LEGACY_PROFILE"; fi
          if [[ -n "$MODERN_PROFILE" ]]; then rm -f "$MODERN_PROFILE"; fi
          security delete-keychain "$RUNNER_TEMP/frockbot-signing.keychain-db" 2>/dev/null || true

  github-release:
    name: Create GitHub release
    # A Release is the record that this tag shipped and the desktop download
    # surface, so it is created once production has actually moved — not before
    # the approval, not behind npm publishing (first-publish trust, OIDC), and
    # not before Apple has accepted the Mac app and the ticket has been stapled.
    needs: [verify, deploy-marketing, deploy-backend, macos-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download notarized disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frockbot-macos-release
          path: .release-assets

      - name: Create GitHub release and attach disk image
        # The asset keeps a fixed name so the website's /download/mac redirect
        # can point at `releases/latest/download/FrockBot-macos.dmg` and never
        # needs editing per release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          asset=".release-assets/FrockBot-macos.dmg"
          test -f "$asset"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$asset" \
              --generate-notes \
              --verify-tag
          fi

  deploy-marketing:
    name: Deploy marketing site
    # Production follows the tag, not the branch: merging to main integrates
    # code, and a version tag is what ships it. Both deploys wait on the
    # verify gate, so the riskiest step of a release still runs only against
    # code that typechecks, tests and builds. Both also declare the
    # `production` environment, whose required reviewer holds them until a
    # maintainer approves the run — the one click between a green `main` and
    # bot.frockbot.com. One approval releases every job waiting on it.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://frockbot.com

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy frockbot.com
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  deploy-backend:
    name: Deploy FrockBot app
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.BETTER_AUTH_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] tag-only release job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          BILLING_MODEL_RATES: ${{ secrets.BILLING_MODEL_RATES }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APPLET_VIEWER_SECRET: ${{ secrets.APPLET_VIEWER_SECRET }}
          APPLET_BUILD_TOKEN: ${{ secrets.APPLET_BUILD_TOKEN }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          FROCK_AI_GATEWAY_TOKEN: ${{ secrets.FROCK_AI_GATEWAY_TOKEN || secrets.FLOCK_AI_GATEWAY_TOKEN }}
        shell: bash
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_D1_DATABASE_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          # Every Worker secret is checked against one manifest, here rather
          # than in a list written out by hand in this file: a secret the code
          # requires and production has never had is what kept every published
          # Applet at 503 for weeks (2026-09-05). Failing here, before
          # anything is built, names the secret and what it costs.
          bun scripts/check-production-secrets.ts check || exit 1

          bun -e '
            import { parseCredentialKeyringV1 } from "./core/connection/index.ts";
            parseCredentialKeyringV1(process.env.CREDENTIAL_KEYRING ?? "");
          '
      - name: Configure production D1 database
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!/^[0-9a-fA-F-]{36}$/.test(databaseId)) {
            throw new Error(`CLOUDFLARE_D1_DATABASE_ID is not a database identifier: ${databaseId}`);
          }
          const production = /("database_name":\s*"frockbot-auth",\s*"database_id":\s*")[^"]*(")/;
          const source = fs.readFileSync(file, 'utf8');
          if (!production.test(source)) {
            throw new Error(`${file} no longer contains a production frockbot-auth database_id`);
          }
          fs.writeFileSync(file, source.replace(production, `$1${databaseId}$2`));
          NODE

      # The Flutter Web client is part of the app Worker's `assets` payload, so
      # its build must happen before `wrangler deploy` below. `artifact:build`
      # already chains it — `client:build` runs `flutter build web` in
      # `apps/native` and stages `apps/cloudflare/dist/web` — so this step only
      # has to make the pinned SDK present. Same pin as `native.yml`; no cache
      # in this privileged tag-only job.
      - name: Set up Flutter # zizmor: ignore[cache-poisoning] tag-only release job
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable

      - name: Build application artifact
        working-directory: apps/cloudflare
        run: bun run artifact:build

      - name: Configure application artifact
        id: artifact
        working-directory: apps/cloudflare
        run: |
          artifact_hash="$(sha256sum dist/artifacts/foundation-v1.mjs | cut -d ' ' -f 1)"
          echo "hash=$artifact_hash" >> "$GITHUB_OUTPUT"
          ARTIFACT_HASH="$artifact_hash" node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const placeholder = 'foundation-v1';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(placeholder)) {
            throw new Error(`${file} no longer contains the default application hash ${placeholder}`);
          }
          fs.writeFileSync(file, source.replaceAll(placeholder, process.env.ARTIFACT_HASH));
          NODE

      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply frockbot-auth --remote

      - name: Upload application artifact
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler r2 object put
          frockbot-application-artifacts/applications/${{ steps.artifact.outputs.hash }}.mjs
          --file dist/artifacts/foundation-v1.mjs
          --remote

      - name: Deploy computer host
        # The app's COMPUTER_HOST service binding names this Worker, so it
        # must exist before the app version can be created; and the host must
        # be current before the app that calls it (ADR 0004, risk v). Wrangler
        # builds and pushes the container image here, which needs Docker — the
        # hosted runner has it.
        working-directory: apps/computer-host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-computer-host.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          const names = ['SPRITES_TOKEN', 'COMPUTER_HOST_TOKEN'];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy --secrets-file "$secrets_file"

      - name: Deploy Applet build service
        # The app's APPLET_BUILD service binding names this Worker, so it must
        # exist before the app version can be created. Wrangler builds and
        # pushes the container image here, which needs Docker — the hosted
        # runner has it.
        working-directory: apps/applet-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLET_BUILD_TOKEN: ${{ secrets.APPLET_BUILD_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-applet-build.env"
          trap 'rm -f "$secrets_file"' EXIT

          node <<'NODE' > "$secrets_file"
          const names = ['APPLET_BUILD_TOKEN'];
          console.log(
            JSON.stringify(
              Object.fromEntries(names.map((name) => [name, process.env[name]])),
            ),
          );
          NODE

          bunx wrangler deploy --secrets-file "$secrets_file"

      - name: Verify billing launch readiness
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          BILLING_MODEL_RATES: ${{ secrets.BILLING_MODEL_RATES }}
        run: bun scripts/check-billing-release.ts

      - name: Deploy Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
          # Required: signs the viewer token an open Applet's page presents.
          # Absent, every published Applet answers 503 — which is exactly what
          # production did, unnoticed, from the day the Applet authority
          # shipped until 2026-09-05.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          BILLING_MODEL_RATES: ${{ secrets.BILLING_MODEL_RATES }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APPLET_VIEWER_SECRET: ${{ secrets.APPLET_VIEWER_SECRET }}
          # Required: the same shared secret the Applet build Worker and its
          # container check. A Turn's applet_check and applet_publish both call
          # the service, so without it no Applet can be built or published.
          APPLET_BUILD_TOKEN: ${{ secrets.APPLET_BUILD_TOKEN }}
          # Required: the composer's dictation upstream (OpenAI Realtime) and
          # the voice session's speech (ElevenLabs). The hosted product must
          # work with zero User configuration, so a release without either
          # stops here rather than shipping a microphone that answers "not
          # set up" (docs/voice.md).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Optional: authorizes the read-only /api/debug operator surface.
          # Absent and the deployed Worker simply 404s those routes.
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          # Optional: the `cf-aig-authorization` bearer for the AI Gateway.
          # Present, Frock AI takes the compat HTTP transport, the only one
          # that accepts the `dynamic/<route>` Auto model (cloudflare/ai#617).
          # Absent, it falls back to the `AI` binding and Auto fails.
          # Falls back to the pre-rename repository secret until that one is
          # re-added as FROCK_AI_GATEWAY_TOKEN; `--secrets-file` replaces the
          # Worker's whole secret set, so an unresolved name would delete it.
          FROCK_AI_GATEWAY_TOKEN: ${{ secrets.FROCK_AI_GATEWAY_TOKEN || secrets.FLOCK_AI_GATEWAY_TOKEN }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-production.env"
          trap 'rm -f "$secrets_file"' EXIT

          # The last gate before production. It reads the same manifest the
          # secrets file is written from, so what is checked and what is
          # deployed cannot drift; `--live` also compares the deployed
          # Worker's own secret list, because `--secrets-file` replaces the
          # whole set and would silently delete anything set by hand.
          bun "$GITHUB_WORKSPACE/scripts/check-production-secrets.ts" check --live || exit 1

          # Names, values, and the JSON encoding all come from the manifest:
          # wrangler reads a secrets file as JSON first and only falls back to
          # dotenv, and a dotenv line keeps the backslash escapes inside a
          # double-quoted value — so a secret that is itself JSON (the
          # credential keyring) would reach the Worker mangled.
          bun "$GITHUB_WORKSPACE/scripts/check-production-secrets.ts" write-secrets-file "$secrets_file" || exit 1

          bunx wrangler deploy --secrets-file "$secrets_file"

  promote-android:
    name: Promote Android patch
    # The approval that deploys production is the approval that promotes the
    # patch: this job waits on `deploy-backend`, so a patched client never
    # runs ahead of the server it was built against, and it asks for no
    # second approval of its own. Skipped when no patch was cut.
    needs: [patch-android, deploy-backend]
    if: needs.patch-android.outputs.patch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the qualified Shorebird CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("apps/native/qualification.json"))["shorebird"]["cli"])')"
          git clone --quiet --depth 1 --branch "v$version" \
            https://github.com/shorebirdtech/shorebird.git "$RUNNER_TEMP/shorebird"
          echo "$RUNNER_TEMP/shorebird/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shorebird/bin/shorebird" --version

      - name: Promote the patch to stable
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE: ${{ needs.patch-android.outputs.release }}
          PATCH: ${{ needs.patch-android.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native-update.py promote --release-version "$RELEASE" --patch-number "$PATCH"
          echo "Android: patch \`$PATCH\` on release \`$RELEASE\` is stable. Open the app on the phone twice and confirm the change is live." >> "$GITHUB_STEP_SUMMARY"
