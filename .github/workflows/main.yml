name: Main

# Everything a landed change owes, once per landed change rather than once
# per push: the fast tier `check.yml` ran on the pull request's own head, now
# on the merge commit — a pull request merges without rebasing, so this is
# the first time the combination exists — and then the slow tier: the
# Cloudflare app's workerd and integration suites, the real build, and the
# browser suite across four runners.
#
# The slow tier is spread across runners on purpose. `Validate`, the workerd
# suite and the integration suite share nothing but `bun install`, which is
# seconds, so each is its own job and the run takes as long as the longest of
# them rather than the sum. What the whole tier concluded is read in one
# place: `deploy-staging` and `release` below require every job.
#
# Green here does three things in order: deploys staging when the repository
# variable `DEPLOY_STAGING` is `true`, cuts the next patch tag, and starts
# `release.yml` for it. Production still moves only behind that workflow's
# approval gate on the `production` environment — see `README.md` →
# Releases. Red here blocks nobody's merge; it blocks the deploy, and the
# fix is the next pull request.
#
# Staging is opt-in because it does not exist yet: the `staging` environment
# holds no Cloudflare token and no Google client, and a release must not wait
# on a deploy nobody has configured. Set `DEPLOY_STAGING=true` once the
# environment carries every secret `deploy-staging` validates.

on:
  push:
    branches:
      - main
    # Documentation is `docs/**` and the Markdown files at the repository
    # root. Markdown anywhere else is code: a Package may ship a Skill or a
    # prompt as `.md`. A push that only touches documentation changes nothing
    # deployable, so it starts no run at all — and, unlike a job-level skip,
    # it cannot displace a queued run for a code change.
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and at most one waiting: a burst of merges collapses to
# the run in progress plus one for the newest head, which covers every commit
# between. This is also what makes the tag numbering below race-free.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  runtime:
    name: Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Cloudflare runtime compatibility
        # The Durable Objects in workerd, against probe subclasses. No client
        # and no artifact: this job never needs Flutter.
        run: bun run --filter @frockbot/cloudflare test:workerd

  integration:
    name: Cloudflare integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `test:integration` and `build` both begin with `flutter build web` in
      # `apps/native`: the web client is Flutter Web, and `client:build` stages
      # the payload the Worker's `assets` binding uploads. The SDK is pinned to
      # the revision `apps/native/qualification.json` records and `native.yml`
      # checks for, so this builds the client the qualification was taken
      # against.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      # The staged client from the last run that built it from these same
      # sources. `build-flutter-web.ts` fingerprints its inputs and skips
      # `flutter build web` when the staged bundle matches, so a hit here turns
      # a minute of dart2js into a no-op; the key names the same inputs the
      # fingerprint covers, plus the SDK version the fingerprint reads from the
      # toolchain. A miss builds as before and saves for the next run.
      - name: Cache Flutter web client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            apps/cloudflare/dist/web
            apps/cloudflare/dist/flutter-web.json
          key: flutter-web-${{ runner.os }}-3.47.0-${{ hashFiles('apps/native/lib/**', 'apps/native/web/**', 'apps/native/assets/**', 'apps/native/vendor/**', 'apps/native/pubspec.yaml', 'apps/native/pubspec.lock', 'apps/cloudflare/build-flutter-web.ts') }}

      - name: Test Cloudflare integration
        # `SELF.fetch` through the real gateway, the real built artifact and the
        # real Durable Objects. The provider is stubbed at the outbound seam and
        # authentication uses the development identity, so this needs no secret.
        run: bun run --filter @frockbot/cloudflare test:integration

      - name: Build
        # Here rather than in `Validate` because it shares the Flutter client
        # the integration suite just built.
        run: bun run build

  e2e:
    name: Browser end-to-end (${{ matrix.shard }}/${{ strategy.job-total }})
    # Deliberately no `needs`. This job shares nothing with the others — it
    # installs its own dependencies and the harness builds the artifact itself
    # — so gating it behind them only made a two-minute job wait minutes for
    # an answer it never reads. `deploy-staging` below is where they are all
    # required to agree.
    runs-on: ubuntu-latest
    # Twenty was one crash short: a shard that lost `wrangler dev` twice and
    # then spent two four-minute test timeouts was cancelled at the limit,
    # and a cancelled job uploads nothing, so the cause was gone with it.
    timeout-minutes: 30

    # The specs may overlap now — every test takes a fresh identity and its own
    # scoped provider endpoint — but a runner has two cores, so the parallelism
    # that pays here is still across runners rather than across workers within
    # one. Each shard is a whole runner with its own harness:
    # its own ports, its own `--persist-to` directory, its own artifact build.
    # Playwright keeps a spec file whole within a shard, since `fullyParallel`
    # is off and the file is therefore one indivisible group.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # The harness builds the artifact itself, and `artifact:build` now begins
      # with `flutter build web`; without the SDK every shard fails before the
      # first spec. Same pin as the integration job and `native.yml`.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      # Same cache, same key, as the integration job: every shard would
      # otherwise run its own minute of dart2js for an identical bundle.
      - name: Cache Flutter web client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            apps/cloudflare/dist/web
            apps/cloudflare/dist/flutter-web.json
          key: flutter-web-${{ runner.os }}-3.47.0-${{ hashFiles('apps/native/lib/**', 'apps/native/web/**', 'apps/native/assets/**', 'apps/native/vendor/**', 'apps/native/pubspec.yaml', 'apps/native/pubspec.lock', 'apps/cloudflare/build-flutter-web.ts') }}

      - name: Test browser end to end
        # A browser against `wrangler dev` running `src/index.ts` and the real
        # built artifact. The harness builds the artifact, seeds it into the
        # local bucket and starts a fake Ollama server on loopback, so this
        # needs no Cloudflare credential and no provider key.
        working-directory: apps/cloudflare
        run: >-
          bun run test:e2e
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload shard report
        # Unconditional, unlike the failure diagnostics below: the merged report
        # is only whole if every shard contributed its blob, including the ones
        # that passed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-report-${{ matrix.shard }}
          path: apps/cloudflare/e2e/blob-report
          retention-days: 1
          if-no-files-found: error

      - name: Upload Playwright failure diagnostics
        # On cancellation too: the job's own timeout cancels rather than
        # fails, and a shard that ran out of time is exactly the one whose
        # traces are needed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: apps/cloudflare/e2e/test-results
          retention-days: 7

      - name: Print the tail of the harness log
        # The `[WebServer]` stream in the job log stops the moment Playwright
        # tears the server down, so a crash at the end of a shard leaves no
        # visible cause. This is the last of what both `wrangler dev` processes
        # said, in the job log itself, before anybody downloads an artifact.
        if: failure() || cancelled()
        run: |
          shopt -s nullglob
          logs=(apps/cloudflare/e2e/wrangler-logs/harness-*.log)
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "No harness log was written."
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "::group::Last 200 lines of $log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done
          # wrangler's own debug log is where the reason lives when `wrangler
          # dev` exits: its stdout prints a blank `✘ [ERROR]`, while the
          # debug log carries the ProxyController/ProxyWorker error (for
          # example "Network connection lost.") that explains it. Print only
          # the error entries with a little context; the `Error contextual
          # data` dump that follows can be megabytes of bundled worker script,
          # so it stays in the uploaded artifact.
          for log in apps/cloudflare/e2e/wrangler-logs/wrangler-*.log; do
            echo "::group::Error entries in $log"
            grep -n -B 2 -A 12 -E "^Error in ProxyController|\[ERROR\]|Network connection lost|wrangler command errored" "$log" \
              | grep -v -E "inherited by environments|is not what you probably want" \
              | cut -c 1-400 \
              | head -n 400 || echo "No error entries."
            echo "::endgroup::"
          done

      - name: Upload wrangler logs
        # Both halves of a crash: the harness's own tee of everything the two
        # `wrangler dev` processes printed, and wrangler's debug log, which
        # `WRANGLER_LOG_PATH` puts in the same directory. It used to point at
        # `~/.config/.wrangler/logs` and upload nothing at all —
        # `actions/upload-artifact` does not expand `~`.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-logs-${{ matrix.shard }}
          path: apps/cloudflare/e2e/wrangler-logs
          retention-days: 7
          if-no-files-found: warn

  e2e-report:
    name: Browser end-to-end report
    needs: e2e
    # Only when a shard failed: a green run's report is never read, and the
    # merge would cost a runner on every push for nothing.
    if: ${{ failure() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: apps/cloudflare/blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        working-directory: apps/cloudflare
        run: bunx playwright merge-reports --reporter html blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/cloudflare/playwright-report
          retention-days: 7

  deploy-staging:
    name: Deploy staging
    # Staging follows the branch: a landed change shows up running at
    # staging-bot.frockbot.com as soon as the slow tier passes. Production
    # follows the tag that `release` below cuts, so nothing here can ship to
    # bot.frockbot.com.
    #
    # Opt-in through the repository variable `DEPLOY_STAGING`: the job is
    # skipped, not failed, while the environment is unconfigured, so
    # `release` below still cuts the tag.
    needs: [validate, runtime, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.BETTER_AUTH_URL }}

    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
        shell: bash
        run: |
          missing=()
          # FROCKBOT_ADMIN_EMAILS is required here, unlike production. Staging
          # signups are closed and stay closed, so the admin allowlist is the
          # only way any identity reaches the deployment: without it, nobody
          # can sign in and nobody can open Admin to change that.
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            BETTER_AUTH_URL \
            BETTER_AUTH_SECRET \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            FROCKBOT_ADMIN_EMAILS \
            SPRITES_TOKEN \
            COMPUTER_HOST_TOKEN \
            CREDENTIAL_KEYRING \
            ROUTINE_HOOK_SECRET \
            MACHINE_TOKEN_SECRET; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          bun -e '
            import { parseCredentialKeyringV1 } from "./core/connection/index.ts";
            parseCredentialKeyringV1(process.env.CREDENTIAL_KEYRING ?? "");
          '

      - name: Provision staging resources
        # Staging is disposable, so it provisions itself rather than depending
        # on a human having run a wizard first. Every step is create-if-absent,
        # so re-running a deploy neither fails nor recreates anything. The
        # Durable Object namespaces need no step: they are created with the
        # Worker, and belong to it.
        id: resources
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          for bucket in \
            frockbot-application-artifacts-staging \
            frockbot-memory-files-staging; do
            if bunx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
              echo "R2 bucket $bucket already exists"
            else
              bunx wrangler r2 bucket create "$bucket"
            fi
          done

          # 768 cosine dimensions, matching @cf/baai/bge-base-en-v1.5 — the
          # embedding model the memory Package uses on Cloudflare.
          if bunx wrangler vectorize get frockbot-memory-staging >/dev/null 2>&1; then
            echo "Vectorize index frockbot-memory-staging already exists"
          else
            bunx wrangler vectorize create frockbot-memory-staging \
              --preset @cf/baai/bge-base-en-v1.5
          fi

          # `d1 list` is the single authority on whether the database exists and
          # on its identifier, so creation and lookup cannot disagree: an `info`
          # probe would have to guess an exit code, and guessing wrong either
          # creates a database twice or never creates it at all.
          staging_database_id() {
            bunx wrangler d1 list --json |
              node -e '
                const chunks = [];
                process.stdin.on("data", (chunk) => chunks.push(chunk));
                process.stdin.on("end", () => {
                  const parsed = JSON.parse(chunks.join(""));
                  const databases = Array.isArray(parsed) ? parsed : parsed.result;
                  const match = (databases ?? []).find(
                    (database) => database.name === "frockbot-auth-staging",
                  );
                  process.stdout.write(match ? match.uuid : "");
                });
              '
          }

          database_id="$(staging_database_id)"
          if [[ -z "$database_id" ]]; then
            bunx wrangler d1 create frockbot-auth-staging
            database_id="$(staging_database_id)"
          else
            echo "D1 database frockbot-auth-staging already exists"
          fi
          if [[ ! "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            printf 'Resolved staging D1 identifier is not an identifier: %s\n' "$database_id" >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Configure staging D1 database
        working-directory: apps/cloudflare
        env:
          STAGING_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const databaseId = process.env.STAGING_D1_DATABASE_ID;
          const staging = /("database_name":\s*"frockbot-auth-staging",\s*"database_id":\s*")[^"]*(")/;
          const source = fs.readFileSync(file, 'utf8');
          if (!staging.test(source)) {
            throw new Error(`${file} no longer contains a staging frockbot-auth-staging database_id`);
          }
          fs.writeFileSync(file, source.replace(staging, `$1${databaseId}$2`));
          NODE

      # `artifact:build` chains `client:build`, which is `flutter build web`,
      # so the staging Worker's `assets` payload is built here — before the
      # deploy below uploads it. Same pin as the integration job and
      # `native.yml`.
      - name: Set up Flutter # zizmor: ignore[cache-poisoning] trusted main deployment
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Build application artifact
        working-directory: apps/cloudflare
        run: bun run artifact:build

      - name: Configure application artifact
        id: artifact
        working-directory: apps/cloudflare
        run: |
          artifact_hash="$(sha256sum dist/artifacts/foundation-v1.mjs | cut -d ' ' -f 1)"
          echo "hash=$artifact_hash" >> "$GITHUB_OUTPUT"
          ARTIFACT_HASH="$artifact_hash" node <<'NODE'
          const fs = require('node:fs');
          const file = 'wrangler.jsonc';
          const placeholder = 'foundation-v1';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(placeholder)) {
            throw new Error(`${file} no longer contains the default application hash ${placeholder}`);
          }
          fs.writeFileSync(file, source.replaceAll(placeholder, process.env.ARTIFACT_HASH));
          NODE

      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler d1 migrations apply frockbot-auth-staging
          --env staging --remote

      - name: Upload application artifact
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler r2 object put
          frockbot-application-artifacts-staging/applications/${{ steps.artifact.outputs.hash }}.mjs
          --file dist/artifacts/foundation-v1.mjs
          --remote

      - name: Deploy Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FROCKBOT_ADMIN_EMAILS: ${{ secrets.FROCKBOT_ADMIN_EMAILS }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
          COMPUTER_HOST_TOKEN: ${{ secrets.COMPUTER_HOST_TOKEN }}
          CREDENTIAL_KEYRING: ${{ secrets.CREDENTIAL_KEYRING }}
          ROUTINE_HOOK_SECRET: ${{ secrets.ROUTINE_HOOK_SECRET }}
          MACHINE_TOKEN_SECRET: ${{ secrets.MACHINE_TOKEN_SECRET }}
          # Required by `production-secrets.ts`; without it staging answers
          # 503 for every Applet.
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APPLET_VIEWER_SECRET: ${{ secrets.APPLET_VIEWER_SECRET }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          # Voice (docs/voice.md). Required for a production release; carried
          # here when present so staging speaks as soon as the secrets exist,
          # and never blocks a merge before they do.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Connected apps. Optional: staging without them simply cannot
          # connect an app.
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        shell: bash
        run: |
          secrets_file="$RUNNER_TEMP/frockbot-staging.env"
          trap 'rm -f "$secrets_file"' EXIT

          # JSON, not dotenv: see the production deploy in `release.yml` for
          # why a secret that is itself JSON would otherwise arrive mangled.
          node <<'NODE' > "$secrets_file"
          const names = [
            'BETTER_AUTH_URL',
            'BETTER_AUTH_SECRET',
            'GOOGLE_CLIENT_ID',
            'GOOGLE_CLIENT_SECRET',
            'FROCKBOT_ADMIN_EMAILS',
            'SPRITES_TOKEN',
            'COMPUTER_HOST_TOKEN',
            'CREDENTIAL_KEYRING',
            'ROUTINE_HOOK_SECRET',
            'MACHINE_TOKEN_SECRET',
            'APPLET_VIEWER_SECRET',
            'FCM_SERVICE_ACCOUNT',
          ];
          const optional = [
            'DEBUG_TOKEN',
            'OPENAI_API_KEY',
            'ELEVENLABS_API_KEY',
            'COMPOSIO_API_KEY',
          ].filter((name) => process.env[name]);
          console.log(
            JSON.stringify(
              Object.fromEntries(
                [...names, ...optional].map((name) => [name, process.env[name]]),
              ),
            ),
          );
          NODE

          bunx wrangler deploy --env staging --secrets-file "$secrets_file"

  release:
    name: Cut release tag
    # Tagging ships, and this is the tag. The next patch number after the
    # highest `vX.Y.Z` on the repository is created on the revision the slow
    # tier just passed — and staging is now running, when staging is on — and
    # `release.yml` is started for it. A minor or major bump is a tag pushed
    # by hand; this job simply continues from whatever is highest. If the
    # head is already tagged — a hand-cut release that then merged — there is
    # nothing to cut.
    #
    # `release.yml` is started with `workflow run` rather than left to notice
    # the tag: a tag created with `GITHUB_TOKEN` fires no `push` event, and
    # `workflow_dispatch` is the one trigger that token may raise.
    #
    # Runs after a skipped staging deploy as well as a successful one, never
    # after a failed one: `!cancelled()` keeps the job eligible when
    # `deploy-staging` was skipped, and the result checks do the gating.
    needs: [validate, runtime, integration, e2e, deploy-staging]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.validate.result == 'success'
      && needs.runtime.result == 'success'
      && needs.integration.result == 'success'
      && needs.e2e.result == 'success'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Cut the next patch tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          refs="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" \
            --jq '.[] | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"')"

          if grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+ $SHA$" <<<"$refs"; then
            echo "$SHA is already a release tag; nothing to cut"
            exit 0
          fi

          latest="$(grep -Eo '^v[0-9]+\.[0-9]+\.[0-9]+ ' <<<"$refs" \
            | tr -d ' ' | sort -V | tail -n 1)"
          if [[ -z "$latest" ]]; then
            echo "no vX.Y.Z tag exists to continue from; push the first by hand" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<<"${latest#v}"
          tag="v$major.$minor.$((patch + 1))"

          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          echo "created $tag at $SHA"

          gh workflow run release.yml --ref "$tag"
          echo "started release.yml for $tag"
          echo "Cut \`$tag\` at \`$SHA\` and started the release; approve it under the \`production\` environment to deploy." >> "$GITHUB_STEP_SUMMARY"
