name: CLA

# Asks every outside contributor to sign CLA.md before their pull request may
# merge, and records each signature in `signatures/cla-v1.0.json` on the
# `cla-signatures` branch, which is kept apart from `main` so recording one
# never needs a pull request of its own. The agreement is why the core can
# stay MIT while FrockBot for Teams is licensed separately (CONTRIBUTING.md).
#
# `pull_request_target` runs this file as it is on `main`, with a write token,
# so a fork's pull request can be commented on. It never checks out the pull
# request's code, and must not: nothing here may run what a contributor wrote.
#
# A contributor signs by commenting the exact sentence below on their pull
# request; `recheck` asks again. Allowlisted accounts pass without signing.
# The sentence and the signatures file carry CLA.md's version: a new version
# changes both, so nobody's signature silently carries over to new terms.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the FrockBot CLA version 1.0 and I hereby sign it.'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the signatures branch if it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPO/branches/cla-signatures" --silent 2>/dev/null; then
            sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$sha" --silent
          fi
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.0.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # Tim holds the copyright already. Commits from Tim's Claude sessions
          # are authored as noreply@anthropic.com, which GitHub resolves to
          # `claude`. Author emails are unverified, so anyone can claim either
          # identity: an outside pull request is merged only by Tim, who
          # checks who opened it. No `*[bot]` wildcard: anyone can register one.
          allowlist: timoconnellaus,claude,claude[bot],dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the FrockBot CLA version 1.0 and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can merge, each author of
            its commits needs to sign the [FrockBot Contributor Licence
            Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once. It lets FrockBot keep the core MIT while offering commercial
            licences for add-ons; [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)
            explains why. To sign, reply on this pull request with exactly the
            sentence below.
          custom-allsigned-prcomment: Every author of this pull request has signed the FrockBot CLA.
          signed-commit-message: $contributorName signed the CLA in $owner/$repo#$pullRequestNo
          create-file-commit-message: Start recording CLA signatures
