name: CLA

# Asks every outside contributor to sign CLA.md before their pull request may
# merge, and records each signature in `signatures/cla-v1.0.json` on the
# `cla-signatures` branch, which is kept apart from `main` so recording one
# never needs a pull request of its own. The agreement is why the core can
# stay MIT while FrockBot for Teams is licensed separately (CONTRIBUTING.md).
#
# `pull_request_target` runs this file as it is on `main`, with a write token,
# so a fork's pull request can be commented on. It never checks out the pull
# request's code, and must not: nothing here may run what a contributor wrote.
#
# Exemption is by who opened the pull request, which GitHub authenticates,
# never by commit author: the action matches an unlinked commit on its bare
# git author name, so any name on a commit can be forged. Pull requests opened
# by an account in EXEMPT pass, and so do ones changing fewer than five lines,
# too small to carry much copyright. On everyone else's, every commit author
# must have signed, so a commit authored as someone else never passes.
#
# A contributor signs by commenting the exact sentence below; `recheck` asks
# again. The sentence and the signatures file carry CLA.md's version: a new
# version changes both, so nobody's signature carries over to new terms.

on:
  issue_comment:
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] checks out nothing; the action reads pull request metadata only
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Every signature is written to one file, so runs take turns.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         startsWith(github.event.comment.body, 'I have read the FrockBot CLA version 1.0 and I hereby sign it.')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENED_BY: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      # Tim, Dependabot, and each GitHub username listed in Schedule A of a
      # countersigned Corporate CLA (CCLA.md), one per line.
      EXEMPT: >-
        timoconnellaus
        dependabot[bot]
    steps:
      - name: Decide whether this pull request needs a signature
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          case " $EXEMPT " in
            *" $OPENED_BY "*)
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          changed=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.additions + .deletions')
          if [ "$changed" -lt 5 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the signatures branch if it is missing
        if: steps.scope.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPO/branches/cla-signatures" --silent 2>/dev/null; then
            sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$sha" --silent ||
              gh api "repos/$REPO/branches/cla-signatures" --silent
          fi
      - name: CLA Assistant
        if: steps.scope.outputs.needed == 'true'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.0.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: I have read the FrockBot CLA version 1.0 and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can merge, each author of
            its commits needs to sign the [FrockBot Contributor Licence
            Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once. It lets FrockBot keep the core MIT while offering commercial
            licences for add-ons; [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)
            explains why and what to do if your commits are not linked to your
            GitHub account. To sign, reply on this pull request with exactly the
            sentence below.
          custom-allsigned-prcomment: Every author of this pull request has signed the FrockBot CLA.
          signed-commit-message: $contributorName signed the FrockBot CLA v1.0 in $owner/$repo
          create-file-commit-message: Start recording CLA v1.0 signatures
