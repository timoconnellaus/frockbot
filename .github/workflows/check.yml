name: Check

# What a pull request owes before it may merge. It is the fast tier — format,
# typecheck, unit tests and the two small package suites, plus the Flutter
# client's analysis and tests beside them, a few minutes on a cold runner —
# and it needs no secret, so a fork's pull
# request runs it safely. It runs against the pull request's own head, not a
# rebase onto current `main`: the ruleset does not require an up-to-date
# branch, because at this merge rate that requirement was a rebase-and-rerun
# loop. What the merge actually produced is checked by `main.yml`, which runs
# this tier again and the slow one (workerd, integration, the browser suite)
# on the merge commit, and gates staging and production on the result.
#
# The `main` ruleset requires a check by each job's exact name: `Check` and
# `Flutter`.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Seconds each: decoders, shard function, router and server against
      # fakes, then the same in workerd against a Worker at the outbound seam.
      # The Cloudflare app's own workerd and integration suites are minutes
      # each and belong to `main.yml`.
      - name: Test Computer host
        run: bun run --filter @frockbot/computer-host test

      - name: Test Computer host runtime
        run: bun run --filter @frockbot/computer-host test:workerd

      - name: Test Applet build service
        run: bun run --filter @frockbot/applet-build test

      - name: Test Applet build service runtime
        run: bun run --filter @frockbot/applet-build test:workerd

  # The Flutter client's own analysis and tests. `apps/native` is the phone
  # app, the macOS app and the web client at once, and neither `bun test` nor
  # `flutter build web` reads its `test/` directory, so without this a change
  # could leave the Dart tree uncompilable with every other check green. That
  # is not hypothetical: two pull requests that touched different lines of the
  # same sidebar API merged cleanly on 2026-09-12 and `main` stopped compiling
  # its tests. It is a job of its own so it runs beside the Bun tier rather
  # than after it.
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the revision `apps/native/qualification.json` records, the
      # same SDK the web client is built with.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve pinned packages
        working-directory: apps/native
        run: flutter pub get --enforce-lockfile

      # Infos are fatal here as they are locally: a lint left standing is one
      # more line every later run has to read past.
      - name: Analyze Dart
        working-directory: apps/native
        run: flutter analyze --no-pub

      - name: Test Flutter client
        working-directory: apps/native
        run: flutter test --no-pub

      # The Android half of this client is Kotlin, and nothing above compiles
      # it: `flutter test` runs the Dart VM and `flutter build web` never reads
      # `android/`. `badgeReconcileV1` — which stored unread counts a fan-out
      # drops and which already-posted notifications it redraws — is pure
      # Kotlin with a JVM test beside it, so the focused `testDebugUnitTest`
      # task both compiles every Kotlin source in the module and runs that
      # test, with no emulator and no release build.
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      # `gradlew` is not committed, so Gradle comes from here rather than from
      # the wrapper; the version is the one `gradle-wrapper.properties` names,
      # and the action caches Gradle's own downloads between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.3.1

      - name: Test Android badge reconcile
        working-directory: apps/native/android
        shell: bash
        env:
          # The runner holds no installed FrockBot, so the two guards the app's
          # build script keeps for the phone's upgrade track are answered here:
          # a throwaway debug key, and a floor of zero for the version code to
          # clear. A unit test neither signs nor packages anything, and the
          # runner is thrown away with it.
          FROCKBOT_ANDROID_VERSION_FLOOR: "0"
        run: |
          set -euo pipefail
          export FROCKBOT_ANDROID_KEYSTORE="$RUNNER_TEMP/ci-debug.keystore"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 30 -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keystore "$FROCKBOT_ANDROID_KEYSTORE"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            "${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}" \
            > local.properties
          gradle --no-daemon :app:testDebugUnitTest
